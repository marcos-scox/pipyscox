name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'android-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Prepare bundled web application
        run: npm run build:android:web

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build signed debug APK
        run: cd android && ./gradlew --no-daemon assembleDebug

      - name: Verify APK and prepare release asset
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/pipyscox-android.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose dist/pipyscox-android.apk
          unzip -t dist/pipyscox-android.apk >/dev/null

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pipyscox-android-apk
          path: dist/pipyscox-android.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK on GitHub Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/pipyscox-android.apk \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "pipyscox Android $GITHUB_REF_NAME" \
            --notes "APK instalável para Android, empacotado a partir do pipyscox. Esta build usa assinatura de desenvolvimento/debug e destina-se à instalação direta; não é uma build para publicação na Play Store." \
            --prerelease
