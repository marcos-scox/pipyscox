  createCard(){const{pipe,card}=curCard();card.title=(card.title||'').trim();
    if(!card.title){toast('Informe o título do card.','warn');$('#draftTitle')?.focus();return}
    const bl=blockers(pipe,card);if(bl.length){toast(`Resolva antes de criar: <b>${bl.map(esc).join(', ')}</b>`,'warn',5000);return}
    const now=nowISO();card.createdAt=card.phaseEnteredAt=card.history[0].enteredAt=now;logCard(card,'Criou o card',`Fase ${phaseOf(pipe,card.phaseId).name}`);
    pipe.cards.push(card);S.draftCard=null;S.openCard=null;$('#modalRoot').innerHTML='';runAuto(pipe,card,card.phaseId,'enter');save();renderMain();
    const el=document.querySelector(`[data-card="${card.id}"]`);if(el){el.scrollIntoView({block:'nearest'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1600)}toast('Card criado.')},
  openCard(el){openCard(S.route.id,el.dataset.id)},
  openCardAny(el){openCard(el.dataset.p,el.dataset.id)},
  closeModal(){closeModal()},
  cardTab(el){S.cardTab=el.dataset.t;renderCardModal();if(S.cardTab==='comments')$('#cmIn')?.focus()},
  cfgFromCard(el){const p=S.openCard.pipeId;closeModal();go({v:'phase',id:p,ph:el.dataset.ph})},
  tagToggle(el){const{pipe,card}=curCard();const{f}=findField(pipe,el.dataset.f);let v=Array.isArray(card.values[f.id])?card.values[f.id]:[];const o=el.dataset.o;const on=!v.includes(o);
    v=on?(f.multiple?[...v,o]:[o]):v.filter(x=>x!==o);card.values[f.id]=v;card.updatedAt=nowISO();
    if(!S.openCard.draft){logCard(card,on?'Aplicou tag':'Removeu tag',`${f.label}: ${optLabel(f,o)}`);save();checkComplete(pipe,card)}renderCardModal()},
  async fileDl(el){const{card}=curCard();const x=card.values[el.dataset.f][+el.dataset.i];try{const f=await readFile(x.path);downloadBlob(f,x.name)}catch(e){toast('Arquivo não encontrado na pasta: '+esc(x.path),'err',5000)}},
  async fileRm(el){const{pipe,card}=curCard();const list=card.values[el.dataset.f];const x=list[+el.dataset.i];if(!await confirmBox('Remover arquivo',`Remover <b>${esc(x.name)}</b> do card e da pasta?`,'Remover',true)){renderCardModal();return}
    await removePath(x.path);list.splice(+el.dataset.i,1);if(!S.openCard.draft){logCard(card,'Removeu anexo',x.name);save()}$('#modalRoot').innerHTML='';renderCardModal()},
  async cardDelete(){const{pipe,card}=curCard();if(await deleteCardFlow(pipe,card)){S.openCard=null;$('#modalRoot').innerHTML='';lastTrashed=card.id;renderMain()}else renderCardModal()},
  async cardDel(el){const pipe=pipeById(el.dataset.p||S.route.id);const card=pipe?.cards.find(c=>c.id===el.dataset.id);if(!card)return;if(await deleteCardFlow(pipe,card)){lastTrashed=card.id;renderMain()}},
  undoTrash(el){const t=S.db.trash.find(x=>x.kind==='card'&&x.item.id===lastTrashed);if(t&&restoreTrash(t)){renderMain();toast('Card restaurado.')}el.closest('.toast')?.remove()},

  rmComment(el){const{card}=curCard();card.comments=card.comments.filter(c=>c.id!==el.dataset.id);logCard(card,'Apagou um comentário');save();renderCardModal()},
  addField(el){const{ph}=phaseCtx();const it=PALETTE.find(x=>x.k===el.dataset.t);const f=newField(it.t,it.preset);ph.fields.push(f);S.selField=f.id;save();renderFbAll();renderAutoPanel()},
  selField(el,e){if(e.target.closest('[data-act="rmField"]'))return;S.selField=el.dataset.id;renderFbList();renderFbProps()},
  async rmField(el,e){e.stopPropagation();const{p,ph}=phaseCtx();const f=ph.fields.find(x=>x.id===el.dataset.id);const used=p.cards.filter(c=>!isEmptyVal(f,c.values[f.id])&&!['time','phasetag'].includes(f.type)).length;

    ph.fields=ph.fields.filter(x=>x!==f);p.cards.forEach(c=>{if(f.type==='file'&&Array.isArray(c.values[f.id]))c.values[f.id].forEach(x=>removePath(x.path));delete c.values[f.id]});if(S.selField===f.id)S.selField=null;save();renderFbAll();renderAutoPanel()},

  adAdd(){const{ph}=phaseCtx();const a=S.ad;

    if(!need){toast('Complete os dados da automação.','warn');return}

  adRm(el){const{ph}=phaseCtx();ph.automations=ph.automations.filter(a=>a.id!==el.dataset.id);save();renderAutoPanel();renderFbAll()},

  async trashPurge(el){const t=S.db.trash.find(x=>x.id===el.dataset.id);if(!t)return;if(!await confirmBox('Excluir definitivamente',`Apagar <b>${esc(t.kind==='pipe'?t.item.name:t.item.title)}</b> e seus anexos da pasta? Isso não pode ser desfeito.`,'Excluir definitivamente',true))return;await purgeTrash(t);save();renderMain()},

  async backupFolder(){if(isLocalStore()){toast('Backups em pasta só estão disponíveis no modo computador.','warn',4500);return}try{await backupToFolder();loadBackups()}catch(e){toast('Erro no backup: '+esc(e.message),'err')}},
  async bkDl(el){downloadBlob(await readFile('backups/'+el.dataset.n),el.dataset.n)},

  async bkRestore(el){if(!await confirmBox('Restaurar backup',`Restaurar <b>${esc(el.dataset.n)}</b>? Os dados atuais serão substituídos (um backup deles será criado antes).`,'Restaurar',true)){renderMain();return}
    try{const f=await readFile('backups/'+el.dataset.n);await restoreZip(await f.arrayBuffer())}catch(e){toast('Erro ao restaurar: '+esc(e.message),'err',6000)}},
  async changeFolder(){const h=await pickFolder();if(!h)return;if(!await verifyPerm(h,true))return;
    if(await h.isSameEntry?.(S.dir)){toast('Essa já é a pasta atual.','warn');return}
    let has=false;try{await h.getFileHandle(DBFILE);has=true}catch(e){}
    if(!has&&S.db.pipes.length&&await confirmBox('Pasta vazia',`A pasta <b>${esc(h.name)}</b> ainda não tem dados do pipyscox. Copiar os dados atuais (incluindo arquivos) para ela?`,'Copiar dados')){
      await flush();const all=await walk(S.dir);for(const e of all){if(e.path.startsWith('backups/'))continue;await writeFile(e.path,await e.handle.getFile(),h)}}
    await openDir(h);S.route={v:'config'};renderAll();toast('Pasta alterada para <b>'+esc(h.name)+'</b>')},
  async reloadData(){await loadDb();renderAll();toast('Dados recarregados da pasta.')},

  async conflictOverwrite(){$('#modalRoot').innerHTML='';try{const n=await backupToFolder(true,'backup',true);await flush(true);toast(`Suas alterações foram gravadas. A versão externa ficou salva em <b>backups/${esc(n)}</b>.`,'ok',6000)}catch(e){toast('Erro: '+esc(e.message),'err')}},
  async gateChoose(){const h=await pickFolder();if(h)await openDir(h)},
  async useLocalStore(){await openLocalStore()},
  async gateReconnect(){const h=await kvGet('dir');if(h&&await verifyPerm(h,true))await openDir(h);else toast('Permissão não concedida.','warn')}
};

<script>
/* pipyscox · app/inputs.js
   Inputs, mudanças e atalhos de teclado */
'use strict';
/* ===================== Inputs / changes ===================== */
const I={
  pipeName(el){const p=pipeById(S.route.id);el.size=Math.max(8,el.value.length+2);p.name=el.value.trim()||'Sem nome';save();renderSidebar()},
  phName(el){const{ph}=phaseCtx();ph.name=el.value.trim()||'Sem nome';save();const t=document.querySelector('#phTabs .tab.on .tn');if(t)t.textContent=ph.name},
  fv(el){const{pipe,card}=curCard();const{f}=findField(pipe,el.dataset.f);let v=el.value;

    if(!S.openCard.draft)save()},
  cardTitle(el){const{card}=curCard();if(S.openCard.draft){card.title=el.value;return}card.title=el.value.trim()||'Sem título';save()},
  fProp(el){const f=selF();f[el.dataset.k]=el.value;save();renderFbList();renderFbMini()},
  optName(el){const f=selF();const o=f.options.find(x=>x.id===el.dataset.o);o.label=el.value;save();renderFbMini()},
  adSet(el){S.ad[el.dataset.k]=el.value},
  formSet(el){const p=pipeById(S.route.id);p.form[el.dataset.k]=el.value;save()},
  bfQ(el){bf().q=el.value;renderBoard()},
  dfQ(el){S.dataF.q=el.value;const pipe=S.dataF.pipe?pipeById(S.dataF.pipe):null;const rows=dataRows();$('#dataTbl').innerHTML=dataTable(rows,pipe);$('#dfCount').textContent=rows.length+' registro'+(rows.length===1?'':'s')}
};
const C={
  phColorCustom(el){const p=pipeById(S.route.id),ph=phaseOf(p,el.dataset.ph);ph.color=el.value;save();renderMain()},
  cardMove(el){const{pipe,card}=curCard();moveCard(pipe,card,el.value);renderCardModal()},
  fsel(el){const{pipe,card}=curCard();const{f}=findField(pipe,el.dataset.f);card.values[f.id]=el.value;card.updatedAt=nowISO();if(!S.openCard.draft){logCard(card,'Alterou campo',`${f.label}: ${textVal(pipe,card,f)||'(vazio)'}`);save();checkComplete(pipe,card);renderCardModal()}},
  fchk(el){const{pipe,card}=curCard();const{f}=findField(pipe,el.dataset.f);card.values[f.id]=el.checked;card.updatedAt=nowISO();if(!S.openCard.draft){logCard(card,el.checked?'Marcou':'Desmarcou',f.label);save();checkComplete(pipe,card);renderCardModal()}},
  async fileAdd(el){const{pipe,card}=curCard();const fid=el.dataset.f;const files=[...el.files];if(!files.length)return;const list=Array.isArray(card.values[fid])?card.values[fid]:(card.values[fid]=[]);
    for(const f of files){const safe=f.name.replace(/[\\/:*?"<>|]+/g,'_');const path=`arquivos/${pipe.id}/${card.id}/${Date.now()}-${safe}`;try{await writeFile(path,f);list.push({name:f.name,path,size:f.size,type:f.type,addedAt:nowISO()})}catch(e){toast('Erro ao gravar '+esc(f.name)+': '+esc(e.message),'err')}}
    card.updatedAt=nowISO();if(!S.openCard.draft){logCard(card,'Anexou arquivo(s)',files.map(f=>f.name).join(', '));save();checkComplete(pipe,card)}renderCardModal();toast(files.length+' arquivo(s) salvo(s) na pasta.')},
  fPropB(el){const f=selF();f[el.dataset.k]=el.checked;if(el.dataset.k==='multiple'&&!el.checked){const{p}=phaseCtx();p.cards.forEach(c=>{if(Array.isArray(c.values[f.id]))c.values[f.id]=c.values[f.id].slice(0,1)})}save();renderFbList();renderFbMini();if(el.dataset.k==='required')renderAutoPanel()},
  optColor(el){const f=selF();f.options.find(x=>x.id===el.dataset.o).color=el.value;save();renderFbMini()},
  adSet(el){const k=el.dataset.k;S.ad[k]=el.value;if(k==='action'){S.ad.fieldId='';S.ad.optId='';S.ad.value=''}else if(k==='fieldId'){S.ad.optId='';S.ad.value=''}renderAutoPanel()},
  formSet(el){const p=pipeById(S.route.id);p.form[el.dataset.k]=el.type==='checkbox'?el.checked:el.value;save();formModal()},
  async formImport(el){await importFormResponses([...el.files])},
  async csvImport(el){const f=el.files[0];closePop();if(f)await csvImportFlow(f)},
  bfTag(el){bf().tag=el.value;renderBoard()},
  bfResp(el){bf().resp=el.value;renderBoard()},
  bfStale(el){bf().stale=el.checked;renderBoard()},
  abSet(el){const ab=S.db.settings.autoBackup;const k=el.dataset.k;ab[k]=el.type==='checkbox'?el.checked:(el.type==='number'?Math.max(1,+el.value||1):el.value);save();if(k==='mode'||k==='enabled')renderMain()},
  dfPipe(el){S.dataF.pipe=el.value;S.dataF.phase='';renderMain()},
  dfPhase(el){S.dataF.phase=el.value;renderMain()},
  async zipImport(el){const f=el.files[0];if(!f)return;if(!await confirmBox('Importar ZIP',`Importar <b>${esc(f.name)}</b>? Os dados atuais da pasta serão substituídos (um backup será criado antes).`,'Importar',true)){renderMain();return}
    try{await restoreZip(await f.arrayBuffer())}catch(e){toast('Erro ao importar: '+esc(e.message),'err',6000)}}
};
document.addEventListener('click',e=>{
  if(e.target.matches('[data-overlay]')){if(S.openCard)closeModal();return}
  if(S.pop!==null&&!e.target.closest('.pop')&&!e.target.closest('[data-act="phaseMenu"],[data-act="pipeMenu"]'))closePop();
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  if(el.dataset.act==='phaseMenu'||el.dataset.act==='pipeMenu')S.pop=el.dataset.ph||'pipe';
  const fn=A[el.dataset.act];if(fn){if(el.tagName==='A')e.preventDefault();fn(el,e)}
});
document.addEventListener('input',e=>{const el=e.target.closest('[data-in]');if(el&&I[el.dataset.in])I[el.dataset.in](el,e)});
document.addEventListener('change',e=>{const el=e.target.closest('[data-ch]');if(el&&C[el.dataset.ch]){C[el.dataset.ch](el,e);return}
  const fv=e.target.closest('[data-in="fv"]');if(fv&&S.openCard&&!S.openCard.draft){const{pipe,card}=curCard();const{f}=findField(pipe,fv.dataset.f);if(f){const before=card.phaseId;logCard(card,'Alterou campo',`${f.label}: ${textVal(pipe,card,f)||'(vazio)'}`);save();checkComplete(pipe,card);if(card.phaseId!==before)renderCardModal()}}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(S.pop!==null)closePop();else if(S.openCard)closeModal()}
  if(e.key==='Enter'&&S.openCard?.draft&&e.target.id==='draftTitle'){e.preventDefault();A.createCard()}
  if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&e.target.id==='cmIn'){e.preventDefault();A.addComment()}

});
$('#gsearch').addEventListener('keydown',e=>{if(e.key==='Enter'&&S.db){S.dataF={pipe:'',phase:'',q:e.target.value};go({v:'data'});e.target.value='';const q=$('#dfQ');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}});

<script>
/* pipyscox · app/dnd.js
   Arrastar e soltar (cards, fases e campos) */
'use strict';
/* ===================== Arrastar e soltar ===================== */
document.addEventListener('dragstart',e=>{
  const card=e.target.closest?.('[data-card]'),ph=e.target.closest?.('[data-phdrag]'),pal=e.target.closest?.('[data-ftype]'),fb=e.target.closest?.('[data-fid]');
  if(card)S.drag={k:'card',id:card.dataset.card,el:card};else if(ph)S.drag={k:'phase',id:ph.dataset.phdrag};
  else if(pal)S.drag={k:'new',t:pal.dataset.ftype};else if(fb)S.drag={k:'field',id:fb.dataset.fid,el:fb};else return;
  e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','pipyscox');requestAnimationFrame(()=>S.drag?.el?.classList.add('dragging'));
});
function clearDnD(){document.querySelectorAll('.drop-target,.ph-target,.over').forEach(x=>x.classList.remove('drop-target','ph-target','over'));document.querySelectorAll('.fb-ph').forEach(x=>x.remove());const em=document.querySelector('.fb-empty');if(em)em.style.display=''}
function fbIndex(list,y){const items=[...list.querySelectorAll('.fb-item:not(.dragging)')];for(let i=0;i<items.length;i++){const r=items[i].getBoundingClientRect();if(y<r.top+r.height/2)return{i,items}}return{i:items.length,items}}
document.addEventListener('dragover',e=>{const d=S.drag;if(!d)return;
  if(d.k==='card'||d.k==='phase'){const col=e.target.closest('.col[data-col]');if(!col)return;e.preventDefault();document.querySelectorAll('.drop-target,.ph-target').forEach(x=>x!==col&&x.classList.remove('drop-target','ph-target'));col.classList.add(d.k==='card'?'drop-target':'ph-target')}
  if(d.k==='new'||d.k==='field'){const list=e.target.closest('#fbList');if(!list)return;e.preventDefault();list.classList.add('over');
    const{i,items}=fbIndex(list,e.clientY);let ph=list.querySelector('.fb-ph');if(!ph){ph=document.createElement('div');ph.className='fb-ph'}
    const empty=list.querySelector('.fb-empty');if(empty)empty.style.display='none';if(items[i])list.insertBefore(ph,items[i]);else list.appendChild(ph)}});
document.addEventListener('dragleave',e=>{const list=e.target.closest?.('#fbList');if(list&&!list.contains(e.relatedTarget)){list.classList.remove('over');list.querySelectorAll('.fb-ph').forEach(x=>x.remove());const em=list.querySelector('.fb-empty');if(em)em.style.display=''}});
document.addEventListener('drop',e=>{const d=S.drag;if(!d)return;e.preventDefault();
  if(d.k==='card'){const col=e.target.closest('.col[data-col]');if(col){const p=pipeById(S.route.id);const c=p.cards.find(x=>x.id===d.id);if(c&&moveCard(p,c,col.dataset.col)){p.cards=p.cards.filter(x=>x!==c);p.cards.push(c)}renderBoard()}}
  if(d.k==='phase'){const col=e.target.closest('.col[data-col]');if(col&&col.dataset.col!==d.id){const p=pipeById(S.route.id);const from=p.phases.findIndex(x=>x.id===d.id);const[m]=p.phases.splice(from,1);const to=p.phases.findIndex(x=>x.id===col.dataset.col);p.phases.splice(to,0,m);save();renderBoard()}}
  if(d.k==='new'||d.k==='field'){const list=e.target.closest('#fbList');if(list){const{ph}=phaseCtx();const{i}=fbIndex(list,e.clientY);
    if(d.k==='new'){const it=PALETTE.find(x=>x.k===d.t);const f=newField(it.t,it.preset);ph.fields.splice(i,0,f);S.selField=f.id}else{const f=ph.fields.find(x=>x.id===d.id);ph.fields=ph.fields.filter(x=>x!==f);ph.fields.splice(i,0,f)}save();renderFbAll();renderAutoPanel()}}
  clearDnD();S.drag=null});
document.addEventListener('dragend',()=>{clearDnD();document.querySelectorAll('.dragging').forEach(x=>x.classList.remove('dragging'));S.drag=null});

</script>
<script>
/* pipyscox · ui/animations.js
   Camada de animação: entrada de telas, contadores, destaque do card movido,
   fechamento suave de modais e troca de tema. Não altera dados. */
'use strict';
const ANIM={on:true,lastKey:'',moved:null,theme:null,viewT:null};
try{ANIM.on=localStorage.getItem('pipyscox-anim')!=='off'}catch(e){}
const reduceMotion=window.matchMedia?matchMedia('(prefers-reduced-motion: reduce)'):{matches:false};
const animOn=()=>ANIM.on&&!reduceMotion.matches;
function applyAnimPref(){document.documentElement.classList.toggle('no-anim',!animOn())}
function setAnim(on){ANIM.on=on;try{localStorage.setItem('pipyscox-anim',on?'on':'off')}catch(e){}applyAnimPref()}
applyAnimPref();reduceMotion.addEventListener?.('change',applyAnimPref);

/* Numera os elementos para criar o efeito "cascata" (--i usado no CSS) */
function stagger(sel,root){root.querySelectorAll(sel).forEach((el,i)=>el.style.setProperty('--i',Math.min(i,24)))}

/* Contador animado para números de destaque (widgets e indicadores) */
function countUp(el){
  const node=[...el.childNodes].find(n=>n.nodeType===3&&/\d/.test(n.textContent));if(!node)return;
  const m=node.textContent.match(/^(\s*)(\d+)([\s\S]*)$/);if(!m)return;const target=+m[2];if(target<2)return;
  const t0=performance.now(),dur=750;
  const step=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);node.textContent=m[1]+Math.round(target*e)+m[3];if(k<1)requestAnimationFrame(step)};
  node.textContent=m[1]+'0'+m[3];requestAnimationFrame(step);
}

function animateView(){
  if(!animOn())return;const c=$('#content');if(!c)return;
  clearTimeout(ANIM.viewT);c.classList.remove('view-in');void c.offsetWidth;
  ['.widget','.pipe-card','.stat','.col','.kcard','.panel','.pal-item','.fb-item','.tbl tbody tr','.rbar','.wchart g.wk','.auto-item'].forEach(s=>stagger(s,c));
  c.querySelectorAll('.w-val,.stat b').forEach(countUp);
  c.classList.add('view-in');
  ANIM.viewT=setTimeout(()=>c.classList.remove('view-in'),1600);
}

/* Anima a tela apenas quando a rota muda (não a cada redesenho) */
const _renderMain=renderMain;
renderMain=function(){
  _renderMain();
  const r=S.route,key=[r.v,r.id||'',r.ph||''].join('|');
  if(key!==ANIM.lastKey){ANIM.lastKey=key;animateView()}
};

/* Destaca o card que acabou de mudar de fase */
const _moveCard=moveCard;
moveCard=function(pipe,card,toId,opt){const ok=_moveCard(pipe,card,toId,opt);if(ok)ANIM.moved=card.id;return ok};
const _renderBoard=renderBoard;
renderBoard=function(){
  _renderBoard();
  if(ANIM.moved&&animOn()){const el=document.querySelector(`[data-card="${ANIM.moved}"]`);if(el){el.classList.add('drop-pop');setTimeout(()=>el.classList.remove('drop-pop'),600)}}
  ANIM.moved=null;
};

/* Fechamento suave do modal do card */
const _closeModal=closeModal;
closeModal=function(){
  const ov=$('#modalRoot .overlay');
  if(animOn()&&ov&&!ov.classList.contains('closing')){ov.classList.add('closing');setTimeout(_closeModal,150)}
  else _closeModal();
};

/* Transição de cores ao trocar o tema */
const _renderTheme=renderTheme;
renderTheme=function(){
  if(ANIM.theme&&ANIM.theme!==S.theme&&animOn()){const h=document.documentElement;h.classList.add('theming');setTimeout(()=>h.classList.remove('theming'),420)}
  ANIM.theme=S.theme;_renderTheme();
};

/* Opção em Configurações → Aparência */
C.animSet=el=>{setAnim(el.checked);toast(el.checked?'Animações ativadas.':'Animações desativadas.')};

</script>
<script>
/* pipyscox · app/timers.js
   Contadores ao vivo, verificação da pasta e backup automático */
'use strict';
/* ===================== Timers ===================== */
setInterval(()=>{document.querySelectorAll('[data-since]').forEach(el=>{const ms=Date.now()-new Date(el.dataset.since);(el.querySelector('.tv')||el).textContent=fmtDur(ms);if(el.classList.contains('time-b')){const d=ms/864e5;el.classList.toggle('late',d>7);el.classList.toggle('warn',d>3&&d<=7)}})},1000);
setInterval(async()=>{
  if(!S.dir||!S.db||S.saveT||S.saving||S.conflict||S.drag||document.hidden)return;
  try{const f=await readFile(DBFILE);if(!S.lastMod||f.lastModified===S.lastMod)return;
    const ae=document.activeElement;if(ae&&ae.matches('input,textarea,select')&&$('#modalRoot').contains(ae))return;
    await loadDb();renderSidebar();
    if(S.openCard&&!S.openCard.draft){if(curCard().card)renderCardModal();else{$('#modalRoot').innerHTML='';S.openCard=null;renderMain()}}
    else if(!$('#modalRoot').innerHTML)renderMain();
    toast('Dados atualizados: a pasta foi alterada em outra janela ou computador.','ok',4000);
  }catch(e){}
},4000);
setInterval(()=>{if(S.db)maybeAutoBackup()},36e5);

</script>
<script>
/* pipyscox · app/boot.js
   Inicialização */
'use strict';
/* ===================== Inicialização ===================== */
const isMobileDevice=/Android|iPhone|iPad|iPod|Windows Phone/i.test(navigator.userAgent)||window.matchMedia?.('(max-width:640px)').matches;
document.documentElement.classList.toggle('mobile-device',!!isMobileDevice);
(async function boot(){
  try{S.theme=localStorage.getItem('pipyscox-theme')||'dark';S.user=localStorage.getItem('pipyscox-user')||''}catch(e){}
  renderTheme();renderAvatar();
  if(!('showDirectoryPicker' in window)){showGate('unsupported');return}
  const h=await kvGet('dir');
  if(h){try{if(await verifyPerm(h,false)){await openDir(h);return}showGate('reconnect',h.name)}catch(e){showGate('choose')}}
  else showGate('choose');
})();

</script>
