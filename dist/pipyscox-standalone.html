<style>
/* pipyscox · base.css
   Tokens de cor (tema escuro/claro), reset, botões, formulários e chips */
:root{
  --bg:#1b1f27;--surface:#212631;--surface-2:#2a303d;--surface-3:#323a49;--border:#323a49;--border-soft:#2b313d;
  --text:#e4e6ea;--text-2:#b3b9c4;--muted:#7f8897;
  --primary:#5856d6;--primary-2:#6b69e0;--info:#3399ff;--warning:#f0ad1a;--danger:#e05555;--success:#2eb85c;
  --s1:#7d7bef;--s2:#1fa98f;
  --shadow:0 8px 30px rgba(0,0,0,.35);--radius:8px;--chip-bg:rgba(255,255,255,.08);
}
:root[data-theme="light"]{
  --bg:#f3f4f7;--surface:#ffffff;--surface-2:#f1f2f6;--surface-3:#e6e8ee;--border:#dbdfe6;--border-soft:#e8eaef;
  --text:#252b36;--text-2:#4a5160;--muted:#768192;--shadow:0 8px 30px rgba(30,40,60,.12);--chip-bg:rgba(0,0,0,.06);
  --s1:#5856d6;--s2:#12896f;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary-2)}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-btn{background:none;border:0;color:var(--text-2);padding:8px;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap;background:var(--surface-2);color:var(--text)}
.btn:hover{filter:brightness(1.1)}
.btn.primary{background:var(--primary);color:#fff}
.btn.info{background:var(--info);color:#fff}
.btn.danger{background:var(--danger);color:#fff}
.btn.ghost{background:none;border-color:var(--border);color:var(--text-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--text)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
h1.page{font-size:24px;margin:0;font-weight:600}
.page-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.page-head .sp{flex:1}
.input,select.input,textarea.input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 10px;outline:0;color:var(--text)}
.input:focus{border-color:var(--primary-2);box-shadow:0 0 0 3px rgba(88,86,214,.25)}
.input.bad{border-color:var(--danger)}
.ferr{display:block;color:var(--danger);font-size:12px;margin-top:4px}
.ferr:empty{display:none}
textarea.input{resize:vertical;min-height:80px}
label.f{display:block;margin-bottom:14px}
.fl,label.f>span{display:block;font-size:12.5px;color:var(--text-2);margin-bottom:6px;font-weight:500}
.chk{display:flex;align-items:center;gap:10px;margin-bottom:12px;cursor:pointer;font-size:13.5px}
.chk input{width:16px;height:16px;accent-color:var(--primary);flex:none}
.money{display:flex}
.money span{padding:8px 10px;border:1px solid var(--border);border-right:0;border-radius:6px 0 0 6px;background:var(--surface-2);color:var(--muted)}
.money .input{border-radius:0 6px 6px 0}

</style>
<style>
/* pipyscox · layout.css
   Estrutura: menu lateral, cabeçalho, breadcrumbs e responsivo */
.app{display:grid;grid-template-columns:250px 1fr;height:100vh;transition:grid-template-columns .2s}
body.collapsed .app{grid-template-columns:64px 1fr}
.sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.brand{height:64px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--border);white-space:nowrap}
.brand-logo{width:32px;height:32px;flex:none}
.brand b{font-size:19px;letter-spacing:.5px;font-weight:700}
.brand span{font-size:19px;color:var(--info);font-weight:300;letter-spacing:.5px}
.nav{flex:1;overflow-y:auto;padding:8px 0}
.nav-title{font-size:11.5px;font-weight:700;text-transform:uppercase;color:var(--muted);padding:18px 20px 8px;letter-spacing:.6px;white-space:nowrap}
.nav-item{display:flex;align-items:center;gap:14px;margin:2px 8px;padding:10px 12px;border-radius:6px;color:var(--text-2);cursor:pointer;text-decoration:none;white-space:nowrap;border:0;background:none;width:calc(100% - 16px);text-align:left}
.nav-item:hover,.nav-item.active{background:var(--surface-2);color:var(--text)}
.nav-item .lbl{flex:1;overflow:hidden;text-overflow:ellipsis}
.nav-item .dot{width:10px;height:10px;border-radius:3px;flex:none;margin:0 4px}
.badge{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--surface-3);color:var(--text-2)}
.badge.new{background:var(--info);color:#fff}
.side-foot{border-top:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px;white-space:nowrap;cursor:pointer}
.side-foot:hover{color:var(--text)}
.side-foot .st{width:8px;height:8px;border-radius:50%;background:var(--success);flex:none}
body.collapsed .nav-title,body.collapsed .nav-item .lbl,body.collapsed .nav-item .badge,body.collapsed .brand b,body.collapsed .brand span,body.collapsed .side-foot .txt{display:none}
body.collapsed .nav-item{justify-content:center;padding:10px 0}
.main{display:flex;flex-direction:column;min-width:0;height:100vh}
.header{height:64px;flex:none;display:flex;align-items:center;gap:14px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--border)}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:6px;padding:6px 10px;width:300px;max-width:40vw;color:var(--muted);background:var(--bg)}
.header .search{background:none}
.search input{background:none;border:0;outline:0;flex:1;min-width:0;color:var(--text)}
.kbd{font-size:11px;border:1px solid var(--border);border-radius:4px;padding:1px 6px;color:var(--muted);white-space:nowrap}
.header .sp{flex:1}
.save-st{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.save-st .d{width:7px;height:7px;border-radius:50%;background:var(--success)}
.save-st.saving .d{background:var(--warning)}
.save-st.err .d{background:var(--danger)}
.vsep{width:1px;height:28px;background:var(--border)}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--info));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;flex:none;border:0;cursor:pointer}
.avatar.sm{width:28px;height:28px;font-size:11px;cursor:default}
.avatar.xs{width:20px;height:20px;font-size:9px;cursor:default}
.crumbs{height:48px;flex:none;display:flex;align-items:center;gap:8px;padding:0 24px;border-bottom:1px solid var(--border);color:var(--text-2);font-size:14.5px}
.crumbs a{cursor:pointer;color:var(--primary-2);text-decoration:underline}
.content{flex:1;overflow:auto;overflow-x:hidden;padding:24px;min-width:0}

</style>
<style>
/* pipyscox · components.css
   Painéis, modais, popovers, tabelas, toasts e tela de pasta */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
.panel-h{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.panel-h h3{margin:0;font-size:17px;font-weight:600}
.panel-b{padding:20px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;color:#fff;line-height:1.6}
.chip.soft{background:var(--chip-bg);color:var(--text-2);font-weight:500}
.pill{font-size:11px;padding:1px 8px;border-radius:10px;background:var(--primary);color:#fff;font-weight:600}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .i{width:42px;height:42px;stroke-width:1.3;margin-bottom:10px}
.swatches{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sw{width:24px;height:24px;border-radius:6px;border:2px solid transparent;cursor:pointer;padding:0}
.sw.on{border-color:var(--text)}
input[type=color].sw{background:none;border:1px dashed var(--muted);padding:0;overflow:hidden}
input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
input[type=color]::-webkit-color-swatch{border:0;border-radius:4px}
.pop{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);padding:6px;min-width:230px}
.pop button.it{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;padding:8px 10px;border-radius:5px;cursor:pointer;text-align:left;color:var(--text-2)}
.pop button.it:hover,.pop label.it:hover{background:var(--surface-2);color:var(--text)}
.pop button.it.danger{color:var(--danger)}
.pop .sec{padding:8px 10px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin:4px 0}
.pop .sec small{display:block;color:var(--muted);margin-bottom:6px}
.overlay{position:fixed;inset:0;background:rgba(5,8,14,.6);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:10px;width:100%;max-width:480px;box-shadow:var(--shadow)}
.modal.lg{max-width:1000px}
.modal.md{max-width:640px}
.modal.draft{max-width:560px}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-h h3{margin:0;font-size:17px;flex:1}
.modal-b{padding:20px}
.modal-f{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--border)}
.tbl-wrap{overflow:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-weight:600;color:var(--text-2);padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface-2)}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--border-soft);vertical-align:top}
.tbl.click tbody tr{cursor:pointer}
.tbl.click tbody tr:hover{background:var(--surface-2)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--border);border-left:4px solid;border-radius:8px;padding:14px 16px}
.stat b{font-size:22px;display:block}
.cfg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:20px;align-items:start}
.tree{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:12px;color:var(--text-2);white-space:pre;overflow:auto}
.gate{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
.gate .box{max-width:520px;width:100%;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:40px 32px;box-shadow:var(--shadow)}
.gate h2{margin:16px 0 8px;font-size:24px}
.gate p{color:var(--text-2);margin:0 0 22px}
.toasts{position:fixed;right:20px;bottom:20px;z-index:90;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--success);box-shadow:var(--shadow);border-radius:8px;padding:12px 16px;max-width:380px;animation:tin .2s}
.toast.err{border-left-color:var(--danger)}
.toast.warn{border-left-color:var(--warning)}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
.hidden{display:none!important}
.print-only{display:none}

</style>
<style>
/* pipyscox · dashboard.css
   Dashboard: widgets e cards de pipys */
.widgets{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px;margin-bottom:24px}
.widget{border-radius:var(--radius);color:#fff;padding:18px 18px 0;overflow:hidden;min-height:162px;display:flex;flex-direction:column}
.w-top{display:flex;justify-content:space-between;align-items:flex-start}
.w-val{font-size:24px;font-weight:700}
.w-val small{font-size:14px;font-weight:400;opacity:.9;margin-left:4px}
.w-lbl{font-size:15px;opacity:.95;margin-top:2px}
.w-chart{margin-top:auto;display:block;width:100%;height:80px}
.pipe-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.pipe-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;cursor:pointer;position:relative;overflow:hidden;transition:transform .15s,border-color .15s}
.pipe-card:hover{transform:translateY(-2px);border-color:var(--primary)}
.pipe-card .bar{position:absolute;left:0;top:0;bottom:0;width:4px}
.pipe-card h4{margin:0 0 6px;font-size:16px}
.phase-strip{display:flex;gap:3px;margin-top:14px;height:6px}
.phase-strip span{flex:1;border-radius:3px}

</style>
<style>
/* pipyscox · board.css
   Quadro kanban: filtros, colunas e cards */
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.filters .input{width:auto;padding:6px 10px}
.filters .search{width:260px;padding:5px 10px}
.filters .chk{margin:0;font-size:13px;color:var(--text-2)}
.board{display:flex;gap:16px;align-items:flex-start;overflow-x:auto;padding-bottom:16px;min-height:calc(100vh - 300px)}
.col{width:290px;flex:none;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;max-height:calc(100vh - 290px)}
.col.drop-target{outline:2px dashed var(--primary-2);outline-offset:2px}
.col.ph-target{box-shadow:-4px 0 0 var(--info)}
.col-head{display:flex;align-items:center;gap:8px;padding:12px 12px 12px 14px;border-top:4px solid;border-radius:var(--radius) var(--radius) 0 0;cursor:grab;user-select:none}
.col-name{font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-count{font-size:12px;background:var(--surface-2);color:var(--text-2);padding:1px 8px;border-radius:10px}
.col-body{padding:4px 10px 10px;overflow-y:auto;flex:1;min-height:60px;display:flex;flex-direction:column;gap:10px}
.col-foot{padding:8px 10px 12px}
.add-card{width:100%;border:1px dashed var(--border);background:none;color:var(--muted);border-radius:6px;padding:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.add-card:hover{color:var(--text);border-color:var(--muted);background:var(--surface-2)}
.col.ghost{background:none;border:2px dashed var(--border);align-items:center;justify-content:center;min-height:120px;cursor:pointer;color:var(--muted)}
.col.ghost:hover{border-color:var(--primary-2);color:var(--text)}
.kcard{position:relative;background:var(--surface-2);border:1px solid var(--border-soft);border-left:3px solid;border-radius:6px;padding:10px 12px;cursor:pointer;transition:box-shadow .15s}
.kcard:hover{box-shadow:var(--shadow)}
.kcard.dragging{opacity:.4}
.kcard.flash{animation:flash 1.6s}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--primary-2)}}
.kcard .t{font-weight:600;margin-bottom:6px;word-break:break-word;padding-right:24px}
.kdel{position:absolute;top:6px;right:6px;padding:5px;opacity:0;transition:opacity .15s;background:var(--surface-2)}
.kcard:hover .kdel,.kdel:focus{opacity:1}
.kdel:hover{color:var(--danger)!important}
.mc-row{font-size:12.5px;color:var(--text-2);display:flex;align-items:center;gap:6px;margin-top:4px;flex-wrap:wrap;word-break:break-word}
.mc-row .i{width:14px;height:14px}
.mc-row .k{color:var(--muted)}
.kfoot{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:10px;font-size:11.5px;color:var(--muted)}
.kfoot .ic2{display:inline-flex;align-items:center;gap:3px}
.kfoot .ic2 .i{width:12px;height:12px}
.time-b{display:inline-flex;align-items:center;gap:4px;background:var(--chip-bg);padding:1px 7px;border-radius:10px;margin-left:auto}
.time-b .i{width:12px;height:12px}
.time-b.warn{background:rgba(240,173,26,.2);color:var(--warning)}
.time-b.late{background:rgba(224,85,85,.2);color:var(--danger)}

</style>
<style>
/* pipyscox · card.css
   Modal do card: campos, abas, comentários e histórico */
.card-modal{display:grid;grid-template-columns:1fr 290px;min-height:440px}
.card-modal .l{padding:20px;border-right:1px solid var(--border);min-width:0}
.card-modal .r{padding:20px;background:var(--bg);border-radius:0 0 10px 0}
.title-in{font-size:20px;font-weight:600;background:none;border:1px solid transparent;border-radius:6px;padding:4px 8px;margin-left:-8px;width:100%;outline:0}
.title-in:hover{border-color:var(--border)}
.title-in:focus{border-color:var(--primary-2);background:var(--bg)}
.ctabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:10px 0 16px}
.ctab{background:none;border:0;padding:8px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:6px;align-items:center}
.ctab:hover{color:var(--text)}
.ctab.on{color:var(--text);border-bottom-color:var(--primary-2)}
.fsec{border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:16px}
.fsec.cur{border-color:var(--primary)}
.fsec-h{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:14px}
.fsec-h .dot{width:10px;height:10px;border-radius:3px}
.req{color:var(--danger)}
.tagsel{display:flex;gap:6px;flex-wrap:wrap}
.tagsel button{border:1px solid var(--border);background:none;border-radius:20px;padding:3px 11px;cursor:pointer;font-size:12.5px;color:var(--text-2);display:inline-flex;gap:6px;align-items:center}
.tagsel button .dt{width:8px;height:8px;border-radius:50%}
.tagsel button.on{color:#fff;border-color:transparent}
.files{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.file{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-size:13px}
.file .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timebox{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 10px;color:var(--text-2);flex-wrap:wrap}
.hist{list-style:none;padding:0;margin:0}
.hist li{position:relative;padding:0 0 14px 20px;font-size:13px}
.hist li:before{content:"";position:absolute;left:4px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--c,var(--primary))}
.hist li:after{content:"";position:absolute;left:8px;top:16px;bottom:0;width:1px;background:var(--border)}
.hist li:last-child:after{display:none}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--border-soft)}
.kv>span:first-child{color:var(--muted)}
.cmt{display:flex;gap:10px;margin-bottom:14px}
.cmt .bx{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 12px;min-width:0}
.cmt .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.cmt .meta b{color:var(--text-2)}

<style>

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}

<style>
/* pipyscox · animations.css
   Animações e microinterações. Desligadas automaticamente quando o sistema
   pede "movimento reduzido" ou quando o usuário desativa em Configurações. */

:root{
  --ease-out:cubic-bezier(.2,.8,.2,1);
  --ease-spring:cubic-bezier(.2,.9,.3,1.25);
}

/* ---------- Keyframes ---------- */
@keyframes riseIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}
@keyframes modalIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes modalOut{to{opacity:0;transform:translateY(8px) scale(.98)}}
@keyframes popIn{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateX(24px)}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
@keyframes softPulse{0%,100%{box-shadow:0 0 0 0 rgba(224,85,85,0)}50%{box-shadow:0 0 0 4px rgba(224,85,85,.18)}}
@keyframes cardDrop{0%{transform:scale(.92);box-shadow:0 0 0 3px var(--primary-2)}60%{transform:scale(1.03)}100%{transform:none;box-shadow:0 0 0 0 transparent}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes zap{0%,100%{filter:none}50%{filter:drop-shadow(0 0 4px var(--warning))}}
@keyframes outlinePulse{0%,100%{outline-color:var(--primary-2)}50%{outline-color:transparent}}

/* ---------- Entrada de tela (aplicada só quando a rota muda) ---------- */
.view-in>.page-head,.view-in>.filters,.view-in>p{animation:fadeIn .35s var(--ease-out) both}
.view-in .widget,.view-in .pipe-card,.view-in .stat,.view-in .col,.view-in .kcard,
.view-in .panel,.view-in .pal-item,.view-in .fb-item,.view-in .tbl tbody tr,.view-in .auto-item{
  animation:riseIn .45s var(--ease-out) both;animation-delay:calc(var(--i,0) * 35ms)}
.view-in .kcard{animation-delay:calc(120ms + var(--i,0) * 30ms)}
.view-in .w-chart polyline{stroke-dasharray:700;stroke-dashoffset:700;animation:draw 1.1s .25s var(--ease-out) forwards}
.view-in .w-chart circle{animation:fadeIn .4s 1s both}
.view-in .w-chart rect,.view-in .w-chart path{transform-box:fill-box;transform-origin:bottom;animation:growY .7s var(--ease-out) both}
.rbar .fi{transform-origin:left center}
.view-in .rbar .fi{animation:growX .8s var(--ease-out) both;animation-delay:calc(150ms + var(--i,0) * 45ms)}
.wchart g.wk path{transform-box:fill-box;transform-origin:bottom}
.view-in .wchart g.wk path{animation:growY .7s var(--ease-out) both;animation-delay:calc(200ms + var(--i,0) * 60ms)}
.view-in .wchart g.wk text{animation:fadeIn .4s both;animation-delay:calc(500ms + var(--i,0) * 60ms)}
.view-in .empty .i{animation:float 3s ease-in-out infinite}

/* ---------- Modais, popovers e toasts ---------- */
.overlay{animation:fadeIn .18s ease-out both}
.overlay .modal{animation:modalIn .28s var(--ease-spring) both}
.overlay.closing{animation:fadeOut .15s ease-in forwards}
.overlay.closing .modal{animation:modalOut .15s ease-in forwards}
.pop{animation:popIn .16s var(--ease-out) both;transform-origin:top left}
.toast{animation:toastIn .3s var(--ease-spring) both}
.toast.out{animation:toastOut .25s ease-in forwards}
.ctabs+*{animation:fadeIn .2s ease-out}

/* ---------- Microinterações ---------- */
.btn{transition:transform .12s,filter .15s,background-color .15s,border-color .15s,color .15s}
.btn:active:not(:disabled){transform:scale(.96)}
.icon-btn{transition:background-color .15s,color .15s,transform .12s}
.icon-btn:active{transform:scale(.9)}
.nav-item{transition:background-color .15s,color .15s,box-shadow .2s,padding-left .18s}
.nav-item.active{box-shadow:inset 3px 0 0 var(--primary-2)}
body:not(.collapsed) .nav-item:hover{padding-left:16px}
.kcard{transition:box-shadow .18s,transform .18s,opacity .15s}
.kcard:hover{transform:translateY(-2px)}
.kcard.dragging{opacity:.45;transform:rotate(2deg) scale(.97)}
.kcard.drop-pop{animation:cardDrop .55s var(--ease-out)}
.kdel{transition:opacity .15s,color .15s}
.col.drop-target{animation:outlinePulse 1s ease-in-out infinite}
.col{transition:box-shadow .2s}
.widget{transition:transform .2s var(--ease-out),box-shadow .2s}
.widget:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.pipe-card{transition:transform .2s var(--ease-out),border-color .2s,box-shadow .2s}
.pipe-card:hover{box-shadow:var(--shadow)}
.pal-item{transition:border-color .15s,transform .15s,background-color .15s}
.pal-item:hover{transform:translateX(3px)}
.fb-item{transition:border-color .15s,box-shadow .2s,opacity .15s,transform .15s}
.fb-item.dragging{transform:scale(.98)}
.fb-ph{animation:fadeIn .15s}
.tagsel button{transition:background-color .15s,color .15s,transform .1s,border-color .15s}
.tagsel button:active{transform:scale(.92)}
.ctab{transition:color .15s,border-color .2s}
.input{transition:border-color .15s,box-shadow .15s}
.chip{transition:transform .15s}
.save-st.saving .d{animation:pulse .9s ease-in-out infinite}
.time-b.late{animation:softPulse 2.4s ease-in-out infinite}
.col-head [title*="automação"],.tab .i[style*="warning"]{animation:zap 2.5s ease-in-out infinite}
.auto-item .zap{animation:zap 2.5s ease-in-out infinite}
.gate .box{animation:modalIn .5s var(--ease-spring) both}
.gate .box>div:first-child svg{animation:float 3.2s ease-in-out infinite}
.sidebar,.app{transition:grid-template-columns .25s var(--ease-out),transform .25s var(--ease-out)}

/* ---------- Troca de tema suave ---------- */
.theming,.theming *,.theming *::before,.theming *::after{
  transition:background-color .35s ease,color .35s ease,border-color .35s ease,fill .35s ease,stroke .35s ease!important}

/* ---------- Acessibilidade: sem animação ---------- */
.no-anim *,.no-anim *::before,.no-anim *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

</style>

<script>
/* pipyscox · core/storage.js
   Pasta local: IndexedDB, File System Access, leitura/gravação e detecção de conflito */
'use strict';
/* ===================== IndexedDB (referência da pasta) ===================== */
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('pipyscox',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function kvGet(k){try{const d=await idb();return await new Promise(res=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined)})}catch(e){return undefined}}
async function kvSet(k,v){try{const d=await idb();await new Promise(res=>{const tx=d.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=res;tx.onerror=res})}catch(e){}}

/* ===================== Armazenamento local (celular) ===================== */
const LOCAL_DB_KEY='pipyscox-local-db';
function isLocalStore(){return !!S.dir?.local}
async function openLocalStore(){
  S.dir={name:'Armazenamento deste celular',local:true};
  try{
    const raw=localStorage.getItem(LOCAL_DB_KEY);
    S.db=normalize(raw?JSON.parse(raw):{});
  }catch(e){S.db=normalize({});}
  S.lastMod=0;S.conflict=false;hideGate();renderAll();setSaveState('ok');
  if(!S.user)await askUser();else ensurePerson(S.user);
  await autoPurge();return true;
}

/* ===================== Sistema de arquivos ===================== */
async function dirAt(parts,create,root=S.dir){let d=root;for(const p of parts){if(!p)continue;d=await d.getDirectoryHandle(p,{create})}return d}
async function writeFile(path,data,root=S.dir){const parts=path.split('/');const name=parts.pop();const d=await dirAt(parts,true,root);const fh=await d.getFileHandle(name,{create:true});const w=await fh.createWritable();await w.write(data);await w.close()}
async function readFile(path,root=S.dir){const parts=path.split('/');const name=parts.pop();const d=await dirAt(parts,false,root);const fh=await d.getFileHandle(name);return fh.getFile()}
async function removePath(path,root=S.dir){try{const parts=path.split('/');const name=parts.pop();const d=await dirAt(parts,false,root);await d.removeEntry(name,{recursive:true})}catch(e){}}
async function walk(dir,prefix='',out=[]){for await(const[name,h]of dir.entries()){const p=prefix+name;if(h.kind==='file')out.push({path:p,handle:h});else await walk(h,p+'/',out)}return out}

function normalize(db){
  db=db&&typeof db==='object'?db:{};

  db.pipes=Array.isArray(db.pipes)?db.pipes:[];db.trash=Array.isArray(db.trash)?db.trash:[];
  db.settings=db.settings||{};db.settings.people=Array.isArray(db.settings.people)?db.settings.people:[];
  db.settings.autoBackup=Object.assign({enabled:true,mode:'daily',changes:30,keep:10},db.settings.autoBackup||{});
  db.pipes.forEach(normPipe);return db;
}
function normPipe(p){p.id=p.id||uid();p.color=p.color||COLORS[0];p.phases=Array.isArray(p.phases)?p.phases:[];p.cards=Array.isArray(p.cards)?p.cards:[];
  p.form=Object.assign({enabled:false,phaseId:'',title:'',desc:'',titleLabel:'Nome completo',consent:true,consentText:'Autorizo o uso dos dados informados exclusivamente para esta finalidade, conforme a LGPD (Lei 13.709/2018).'},p.form||{});
  p.imported=Array.isArray(p.imported)?p.imported:[];
  p.phases.forEach(ph=>{ph.id=ph.id||uid();ph.color=ph.color||COLORS[1];ph.fields=Array.isArray(ph.fields)?ph.fields:[];ph.automations=Array.isArray(ph.automations)?ph.automations:[];
    ph.fields.forEach(f=>{f.id=f.id||uid();if(f.type==='tag'||f.type==='select')f.options=f.options||[]})});
  p.cards.forEach(normCard);return p}
function normCard(c){c.values=c.values||{};c.createdAt=c.createdAt||nowISO();c.phaseEnteredAt=c.phaseEnteredAt||c.createdAt;
  c.history=Array.isArray(c.history)&&c.history.length?c.history:[{phaseId:c.phaseId,enteredAt:c.phaseEnteredAt,leftAt:null}];
  c.comments=Array.isArray(c.comments)?c.comments:[];c.log=Array.isArray(c.log)?c.log:[];return c}

/* ===================== Leitura / gravação com detecção de alteração externa ===================== */
async function loadDb(){
  if(isLocalStore()){try{S.db=normalize(JSON.parse(localStorage.getItem(LOCAL_DB_KEY)||'{}'))}catch(e){S.db=normalize({})}S.lastMod=0;S.conflict=false;return}
  try{const f=await readFile(DBFILE);S.db=normalize(JSON.parse(await f.text()));S.lastMod=f.lastModified}
  catch(e){
    if(e.name==='NotFoundError'||e.name==='TypeMismatchError'){S.db=normalize({});await writeFile(DBFILE,JSON.stringify(S.db,null,2));S.lastMod=(await readFile(DBFILE)).lastModified}
    else if(e instanceof SyntaxError){
      try{const f=await readFile(DBFILE);await writeFile(`pipyscox.corrompido-${Date.now()}.json`,await f.text())}catch(_){}
      S.db=normalize({});await writeFile(DBFILE,JSON.stringify(S.db,null,2));S.lastMod=(await readFile(DBFILE)).lastModified;
      toast('O arquivo de dados estava corrompido. Uma cópia foi guardada e um novo foi criado.','warn',6000)
    } else throw e;
  }
  S.conflict=false;
}
function setSaveState(st){const el=$('#saveSt');el.className='save-st '+(st==='saving'?'saving':st==='err'?'err':'');el.querySelector('.tx').textContent=st==='saving'?'Salvando...':st==='err'?(S.conflict?'Conflito de versões':'Erro ao salvar'):(isLocalStore()?'Salvo neste celular':'Salvo na pasta')}
function save(){if(!S.db)return;clearTimeout(S.saveT);setSaveState('saving');S.saveT=setTimeout(()=>flush(),350)}
async function flush(force){
  clearTimeout(S.saveT);S.saveT=null;if(!S.dir||!S.db)return;if(S.conflict&&!force)return;
  if(isLocalStore()){try{S.db.updatedAt=nowISO();localStorage.setItem(LOCAL_DB_KEY,JSON.stringify(S.db));setSaveState('ok');S.changeCount++}catch(e){setSaveState('err');toast('Não foi possível salvar neste celular: '+esc(e.message),'err',6000)}return;}
  S.saving=true;
  try{
    if(!force&&S.lastMod){let ext=0;try{ext=(await readFile(DBFILE)).lastModified}catch(e){}
      if(ext&&ext!==S.lastMod){S.conflict=true;setSaveState('err');showConflict();return}}
    S.db.updatedAt=nowISO();await writeFile(DBFILE,JSON.stringify(S.db,null,2));
    S.lastMod=(await readFile(DBFILE)).lastModified;S.conflict=false;setSaveState('ok');S.changeCount++;
    setTimeout(maybeAutoBackup,50);
  }catch(e){console.error(e);setSaveState('err');toast('Não foi possível salvar na pasta: '+esc(e.message),'err',6000)}
  finally{S.saving=false}
}
function showConflict(){
  openModal(`<div class="modal-h"><h3>Os dados da pasta foram alterados</h3></div><div class="modal-b" style="color:var(--text-2)">
  O arquivo <b>pipyscox.json</b> foi modificado fora desta janela (outro computador, outra aba ou sincronização da pasta) depois da sua última gravação.<br><br>
  Para não perder nada, escolha o que fazer:</div>
  <div class="modal-f" style="flex-wrap:wrap"><button class="btn ghost" data-act="conflictReload">${ic('refresh')} Recarregar da pasta (descartar as minhas alterações)</button>
  <button class="btn primary" data-act="conflictOverwrite">${ic('archive')} Manter as minhas (com backup da outra versão)</button></div>`,'md');
}
window.addEventListener('beforeunload',e=>{if(S.saveT||S.saving){flush();e.preventDefault();e.returnValue=''}});

</script>

/* pipyscox · core/zip.js

'use strict';
/* ===================== ZIP (sem dependências) ===================== */

    const time=(d.getHours()<<11)|(d.getMinutes()<<5)|Math.floor(d.getSeconds()/2);
    const date=((Math.max(1980,d.getFullYear())-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,time,true);lh.setUint16(12,date,true);

    chunks.push(new Uint8Array(lh.buffer),name,f.data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,time,true);ch.setUint16(14,date,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,f.data.length,true);ch.setUint32(24,f.data.length,true);ch.setUint16(28,name.length,true);ch.setUint32(42,offset,true);
    central.push(new Uint8Array(ch.buffer),name);offset+=30+name.length+f.data.length;
  }

  end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,cdSize,true);end.setUint32(16,offset,true);

async function readZip(buf){

    if(dv.getUint32(p,true)!==0x02014b50)throw new Error('ZIP corrompido');

  }

  return out;
}
async function buildBackupZip(skipFlush){
  if(!skipFlush)await flush();const all=await walk(S.dir);const files=[];
  for(const e of all){if(e.path.startsWith('backups/'))continue;const f=await e.handle.getFile();files.push({path:e.path,data:new Uint8Array(await f.arrayBuffer()),date:new Date(f.lastModified)})}

async function maybeAutoBackup(){

<script>
/* pipyscox · core/model.js
   Modelo de dados: pipys, fases, campos, cards e validações */
'use strict';
/* ===================== Modelo ===================== */
const pipeById=id=>S.db.pipes.find(p=>p.id===id);
const phaseOf=(pipe,id)=>pipe.phases.find(p=>p.id===id);
const allFields=pipe=>pipe.phases.flatMap(ph=>ph.fields.map(f=>({ph,f})));
function findField(pipe,fid){for(const ph of pipe.phases)for(const f of ph.fields)if(f.id===fid)return{ph,f};return{}}
function people(){return[...new Set(S.db.settings.people.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'))}
function cardFiles(pipe,c){let n=0;pipe.phases.forEach(ph=>ph.fields.forEach(f=>{if(f.type==='file'&&Array.isArray(c.values[f.id]))n+=c.values[f.id].length}));return n}
function timeInPhase(card,phaseId){let t=0;card.history.forEach(h=>{if(h.phaseId===phaseId)t+=(h.leftAt?new Date(h.leftAt):new Date())-new Date(h.enteredAt)});return t}
function passedPhaseIds(card){const seen=[];card.history.forEach(h=>{if(!seen.includes(h.phaseId))seen.push(h.phaseId)});if(!seen.includes(card.phaseId))seen.push(card.phaseId);return seen}
function phaseTagChips(pipe,card,f){return passedPhaseIds(card).filter(id=>f.includeCurrent!==false||id!==card.phaseId).map(id=>phaseOf(pipe,id)).filter(Boolean).map(ph=>`<span class="chip" style="background:${ph.color}">${esc(ph.name)}</span>`).join('')}
function isEmptyVal(f,v){if(f.type==='time'||f.type==='phasetag')return false;if(f.type==='tag'||f.type==='file')return!Array.isArray(v)||!v.length;if(f.type==='checkbox')return!v;return v==null||String(v).trim()===''}
function validField(f,v){if(v==null||String(v).trim()==='')return'';
  if(f.type==='email'&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(v).trim()))return'E-mail inválido';
  if(f.type==='cpf'&&!validCPF(v))return'CPF inválido';
  if(f.type==='phone'){const n=digits(v).length;if(n<10||n>11)return'Telefone incompleto'}
  if((f.type==='number'||f.type==='currency')&&isNaN(parseFloat(v)))return'Número inválido';return''}
function optLabel(f,id){return(f.options||[]).find(o=>o.id===id)?.label||''}
function textVal(pipe,card,f){const v=card.values[f.id];if(f.type==='phasetag')return passedPhaseIds(card).map(id=>phaseOf(pipe,id)?.name).filter(Boolean).join(', ');if(f.type==='time')return'';if(isEmptyVal(f,v))return'';
  switch(f.type){case'date':return fmtDate(v);case'currency':return fmtMoney(v);case'checkbox':return'Sim';case'select':return optLabel(f,v);
    case'tag':return v.map(id=>optLabel(f,id)).filter(Boolean).join(', ');case'file':return v.map(x=>x.name).join(', ');default:return String(v)}}
function tagChips(f,v){if(!Array.isArray(v))return'';return v.map(id=>{const o=(f.options||[]).find(x=>x.id===id);return o?`<span class="chip" style="background:${o.color}">${esc(o.label)}</span>`:''}).join('')}
function newField(type,preset){const f={id:uid(),type,label:FT[type].label,required:false,showOnCard:!['file','cpf','email','phone'].includes(type)};
  if(type==='text'){f.multiline=false;f.placeholder=''}if(type==='date')f.autoFill=true;
  if(type==='tag'){f.multiple=true;f.options=[{id:uid(),label:'Prioridade',color:'#e05555'},{id:uid(),label:'Normal',color:'#3399ff'}]}
  if(type==='select'){f.options=[{id:uid(),label:'Opção 1'},{id:uid(),label:'Opção 2'}]}
  if(type==='checkbox')f.label='Confirmado';if(type==='file')f.accept='';if(type==='phasetag'){f.includeCurrent=true;f.label='Fases percorridas'}
  return Object.assign(f,preset||{})}
function autoFill(pipe,card,phaseId){const ph=phaseOf(pipe,phaseId);if(!ph)return;ph.fields.forEach(f=>{if(f.type==='date'&&f.autoFill&&!card.values[f.id])card.values[f.id]=todayLocal()})}
function blockers(pipe,card){const ph=phaseOf(pipe,card.phaseId);if(!ph)return[];const out=[];ph.fields.forEach(f=>{const v=card.values[f.id];if(f.required&&isEmptyVal(f,v))out.push(f.label);else{const e=validField(f,v);if(e)out.push(f.label+' ('+e.toLowerCase()+')')}});return out}
function logCard(card,action,detail='',by){card.log=card.log||[];const at=nowISO();by=by||S.user||'Usuário';
  const last=card.log[card.log.length-1];
  if(last&&last.action===action&&last.detail===detail&&last.by===by&&Date.now()-new Date(last.at)<120000){last.at=at;return}
  card.log.push({at,by,action,detail});if(card.log.length>500)card.log.splice(0,card.log.length-500)}
function moveCard(pipe,card,toId,opt={}){
  if(card.phaseId===toId||!phaseOf(pipe,toId))return false;
  const bl=blockers(pipe,card);
  if(bl.length){if(opt.auto)logCard(card,'Automação não moveu o card',`Pendências: ${bl.join(', ')}`,'Automação');else toast(`Resolva antes de mover: <b>${bl.map(esc).join(', ')}</b>`,'warn',5000);return false}
  const from=card.phaseId,depth=opt.depth||0;
  runAuto(pipe,card,from,'leave',depth);
  const now=nowISO();const cur=card.history.find(h=>!h.leftAt);if(cur)cur.leftAt=now;
  card.history.push({phaseId:toId,enteredAt:now,leftAt:null});card.phaseId=toId;card.phaseEnteredAt=now;card.updatedAt=now;
  logCard(card,'Moveu o card',`${phaseOf(pipe,from)?.name||'?'} → ${phaseOf(pipe,toId).name}`,opt.auto?'Automação':undefined);
  autoFill(pipe,card,toId);runAuto(pipe,card,toId,'enter',depth);save();return true;
}

<script>
/* pipyscox · core/automations.js
   Motor de automações por fase */
'use strict';
/* ===================== Automações ===================== */
const TRIG={enter:'Quando o card entrar nesta fase',leave:'Quando o card sair desta fase',complete:'Quando os campos obrigatórios desta fase forem preenchidos'};
const ACTS={addTag:'Aplicar tag',removeTag:'Remover tag',setField:'Preencher campo',move:'Mover para a fase',comment:'Adicionar comentário'};
function convertVal(f,raw){raw=raw==null?'':String(raw).trim();if(raw==='')return undefined;
  switch(f.type){
    case'date':{if(/^hoje$/i.test(raw))return todayLocal();const m=raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m)return`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;if(/^\d{4}-\d{2}-\d{2}/.test(raw))return raw.slice(0,10);return undefined}
    case'checkbox':return/^(sim|s|true|1|x|marcado|ok)$/i.test(raw);
    case'number':case'currency':{const n=parseFloat(raw.replace(/[R$\s]/g,'').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.'));return isNaN(n)?undefined:String(n)}
    case'select':return(f.options||[]).find(o=>norm(o.label)===norm(raw))?.id;
    case'tag':{const ids=raw.split(/[,;|]/).map(x=>(f.options||[]).find(o=>norm(o.label)===norm(x))?.id).filter(Boolean);return ids.length?ids:undefined}
    case'cpf':return maskCPF(raw);case'phone':return maskPhone(raw);
    case'file':case'time':case'phasetag':return undefined;
    default:return raw}}
function runAuto(pipe,card,phaseId,trigger,depth=0){
  if(depth>6)return;const ph=phaseOf(pipe,phaseId);if(!ph)return;
  ph.automations.filter(a=>a.trigger===trigger).forEach(a=>applyAuto(pipe,card,a,depth));
}
function applyAuto(pipe,card,a,depth){
  const{f}=a.fieldId?findField(pipe,a.fieldId):{};
  if(a.action==='addTag'&&f){let v=Array.isArray(card.values[f.id])?card.values[f.id]:[];if(!v.includes(a.optId)){v=f.multiple?[...v,a.optId]:[a.optId];card.values[f.id]=v;logCard(card,'Automação aplicou tag',`${f.label}: ${optLabel(f,a.optId)}`,'Automação')}}
  else if(a.action==='removeTag'&&f){const v=Array.isArray(card.values[f.id])?card.values[f.id]:[];if(v.includes(a.optId)){card.values[f.id]=v.filter(x=>x!==a.optId);logCard(card,'Automação removeu tag',`${f.label}: ${optLabel(f,a.optId)}`,'Automação')}}
  else if(a.action==='setField'&&f){const val=f.type==='resp'?a.value:convertVal(f,a.value);if(val!==undefined){card.values[f.id]=val;logCard(card,'Automação preencheu campo',`${f.label}: ${textVal(pipe,card,f)}`,'Automação')}}
  else if(a.action==='comment'&&a.text){card.comments.push({id:uid(),by:'Automação',at:nowISO(),text:a.text,auto:true})}
  else if(a.action==='move'&&a.phaseId){setTimeout(()=>{if(moveCard(pipe,card,a.phaseId,{auto:true,depth:depth+1})){refreshAfterChange()}},0)}
}
function checkComplete(pipe,card){
  if(S.openCard?.draft)return;const ph=phaseOf(pipe,card.phaseId);if(!ph)return;
  const rules=ph.automations.filter(a=>a.trigger==='complete');if(!rules.length)return;
  const req=ph.fields.filter(f=>f.required);if(!req.length)return;
  if(blockers(pipe,card).length)return;
  const key=ph.id+'@'+card.phaseEnteredAt;if(card._done===key)return;card._done=key;
  rules.forEach(a=>applyAuto(pipe,card,a,0));save();
}
function describeAuto(pipe,a){
  const{f}=a.fieldId?findField(pipe,a.fieldId):{};const miss='<span class="req">(campo removido)</span>';let act='';
  if(a.action==='addTag'||a.action==='removeTag')act=`${ACTS[a.action]} <b>${f?esc(optLabel(f,a.optId)||'?'):miss}</b>${f?` em ${esc(f.label)}`:''}`;
  else if(a.action==='setField')act=`Preencher <b>${f?esc(f.label):miss}</b> com <b>${esc(f&&f.type==='select'?optLabel(f,a.value):a.value)}</b>`;
  else if(a.action==='move')act=`Mover para <b>${esc(phaseOf(pipe,a.phaseId)?.name||'(fase removida)')}</b>`;
  else if(a.action==='comment')act=`Comentar: <i>${esc(a.text)}</i>`;
  return`<span class="muted">${esc(TRIG[a.trigger])}</span> → ${act}`;
}

</script>

/* pipyscox · core/trash.js

'use strict';
/* ===================== Lixeira ===================== */
function trashCard(pipe,card){pipe.cards=pipe.cards.filter(c=>c!==card);logCard(card,'Enviou para a lixeira');
  S.db.trash.push({id:uid(),kind:'card',pipeId:pipe.id,pipeName:pipe.name,item:card,deletedAt:nowISO(),by:S.user});save()}
function trashPipe(pipe){S.db.pipes=S.db.pipes.filter(p=>p!==pipe);S.db.trash.push({id:uid(),kind:'pipe',pipeId:pipe.id,pipeName:pipe.name,item:pipe,deletedAt:nowISO(),by:S.user});save()}
function restoreTrash(t){
  if(t.kind==='pipe'){if(pipeById(t.item.id)){toast('Esse pipy já existe.','warn');return false}S.db.pipes.push(normPipe(t.item))}
  else{const p=pipeById(t.pipeId);if(!p){toast(`O pipy <b>${esc(t.pipeName)}</b> também está na lixeira ou foi apagado. Restaure o pipy primeiro.`,'warn',5000);return false}
    const c=normCard(t.item);if(!phaseOf(p,c.phaseId)&&p.phases[0]){const now=nowISO();const cur=c.history.find(h=>!h.leftAt);if(cur)cur.leftAt=now;c.phaseId=p.phases[0].id;c.phaseEnteredAt=now;c.history.push({phaseId:c.phaseId,enteredAt:now,leftAt:null})}
    logCard(c,'Restaurou da lixeira');p.cards.push(c)}
  S.db.trash=S.db.trash.filter(x=>x!==t);save();return true}
async function purgeTrash(t){await removePath(t.kind==='pipe'?`arquivos/${t.item.id}`:`arquivos/${t.pipeId}/${t.item.id}`);S.db.trash=S.db.trash.filter(x=>x!==t)}
async function autoPurge(){const lim=Date.now()-TRASH_DAYS*864e5;const old=S.db.trash.filter(t=>new Date(t.deletedAt)<lim);for(const t of old)await purgeTrash(t);if(old.length){save();toast(`${old.length} item(ns) com mais de ${TRASH_DAYS} dias foram removidos da lixeira.`,'ok',4000)}}
const daysLeft=t=>Math.max(0,Math.ceil(TRASH_DAYS-(Date.now()-new Date(t.deletedAt))/864e5));

</script>

/* pipyscox · core/sample.js

'use strict';
/* ===================== Criar pipy / exemplo ===================== */
function createPipe(name,example){
  const ph=(n,c,fields=[],automations=[])=>({id:uid(),name:n,color:c,fields,automations});
  const p={id:uid(),name,color:COLORS[S.db.pipes.length%COLORS.length],createdAt:nowISO(),phases:[],cards:[]};
  if(example){
    const fNome={...newField('text'),label:'Nome do colaborador',required:true};
    const fCargo={...newField('text'),label:'Cargo'};
    const fEnt=newField('date',{label:'Data de entrada'});
    const fSet={...newField('tag'),label:'Setor',multiple:false,options:[{id:uid(),label:'Administrativo',color:'#3399ff'},{id:uid(),label:'Operacional',color:'#f0ad1a'},{id:uid(),label:'Comercial',color:'#2eb85c'}]};
    const fResp=newField('resp');const fMail={...newField('email'),label:'E-mail'};
    const fDocs={...newField('file'),label:'Documentos'};const fOk={...newField('checkbox'),label:'Documentação conferida',required:true};
    const fPT=newField('phasetag');const fT1=newField('time');const fT2=newField('time');
    const fSal={...newField('currency'),label:'Salário proposto',showOnCard:false};
    const fObs={...newField('text'),label:'Observações',multiline:true,showOnCard:false};
    const fSt={...newField('tag'),label:'Status',options:[{id:uid(),label:'Pendente',color:'#e05555'},{id:uid(),label:'Validado',color:'#2eb85c'}]};
    const phases=[ph('Triagem','#5856d6',[fNome,fCargo,fSet,fResp,fMail,fPT,fEnt,fT1]),ph('Documentação','#3399ff',[fDocs,fOk,fSt,fT2,fObs]),ph('Em análise','#f0ad1a',[fSal]),ph('Concluído','#2eb85c',[])];
    phases[1].automations=[{id:uid(),trigger:'enter',action:'addTag',fieldId:fSt.id,optId:fSt.options[0].id},{id:uid(),trigger:'complete',action:'move',phaseId:phases[2].id}];
    phases[2].automations=[{id:uid(),trigger:'enter',action:'comment',text:'Card entrou em análise. Conferir proposta salarial.'}];
    p.phases=phases;
    const mk=(t,phi,daysAgo,vals)=>{const d=new Date(Date.now()-daysAgo*864e5).toISOString();
      const hist=[...p.phases.slice(0,phi).map((x,i)=>({phaseId:x.id,enteredAt:new Date(Date.now()-(daysAgo+phi-i)*864e5).toISOString(),leftAt:new Date(Date.now()-(daysAgo+phi-i-1)*864e5).toISOString()})),{phaseId:p.phases[phi].id,enteredAt:d,leftAt:null}];
      return normCard({id:uid(),title:t,phaseId:p.phases[phi].id,createdAt:hist[0].enteredAt,phaseEnteredAt:d,history:hist,values:vals,log:[{at:hist[0].enteredAt,by:S.user||'Exemplo',action:'Criou o card',detail:''}]})};
    p.cards=[mk('Colaborador exemplo A',0,1,{[fNome.id]:'Colaborador A',[fCargo.id]:'Assistente',[fSet.id]:[fSet.options[0].id],[fEnt.id]:todayLocal(),[fResp.id]:S.user}),
             mk('Colaborador exemplo B',0,4,{[fNome.id]:'Colaborador B',[fCargo.id]:'Técnico',[fSet.id]:[fSet.options[1].id],[fEnt.id]:todayLocal()}),
             mk('Colaborador exemplo C',1,9,{[fNome.id]:'Colaborador C',[fSet.id]:[fSet.options[2].id],[fSt.id]:[fSt.options[0].id]}),
             mk('Colaborador exemplo D',3,2,{[fNome.id]:'Colaborador D',[fSet.id]:[fSet.options[0].id],[fOk.id]:true,[fSt.id]:[fSt.options[1].id]})];
  } else p.phases=[ph('Caixa de entrada','#5856d6',[newField('date',{label:'Data de entrada'}),newField('resp')]),ph('Em andamento','#3399ff'),ph('Concluído','#2eb85c')];
  normPipe(p);S.db.pipes.push(p);save();return p;

<script>
/* pipyscox · views/dashboard.js
   Tela inicial (dashboard) */
'use strict';
/* ===================== Dashboard ===================== */
function lastDays(n,fn){const out=[];for(let i=n-1;i>=0;i--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);const e=new Date(d);e.setDate(e.getDate()+1);out.push(fn(d,e))}return out}
function chartLine(vals,area){const w=300,h=80,pad=12;const max=Math.max(1,...vals),min=Math.min(...vals);const span=Math.max(1,max-min);const pts=vals.map((v,i)=>[pad+i*(w-2*pad)/(vals.length-1||1),h-14-(v-min)/span*(h-36)]);
  if(area){const d='M0,'+pts[0][1]+pts.map(p=>' L'+p[0]+','+p[1]).join('')+` L${w},${pts[pts.length-1][1]} L${w},${h} L0,${h}Z`;return`<svg class="w-chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${d}" fill="rgba(255,255,255,.22)" stroke="rgba(255,255,255,.55)" stroke-width="2"/></svg>`}
  return`<svg class="w-chart" viewBox="0 0 ${w} ${h}"><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="1.5"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="none" stroke="#fff" stroke-width="1.2"/>`).join('')}</svg>`}
function chartBars(vals){const w=300,h=80,n=vals.length,bw=(w-20)/n*.55,max=Math.max(1,...vals);return`<svg class="w-chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${vals.map((v,i)=>{const bh=Math.max(4,v/max*(h-18));return`<rect x="${10+i*(w-20)/n}" y="${h-bh}" width="${bw}" height="${bh}" fill="rgba(255,255,255,.28)"/>`}).join('')}</svg>`}
function viewHome(){
  crumbs([{t:'Home',attrs:'data-v="home"'},{t:'Dashboard'}]);
  const cards=S.db.pipes.flatMap(p=>p.cards.map(c=>({p,c})));
  const files=cards.reduce((a,{p,c})=>a+cardFiles(p,c),0);
  const stale=cards.filter(({p,c})=>c.phaseId!==p.phases[p.phases.length-1]?.id&&Date.now()-new Date(c.phaseEnteredAt)>7*864e5).length;
  const created=lastDays(12,(a,b)=>cards.filter(({c})=>{const d=new Date(c.createdAt);return d>=a&&d<b}).length);
  const moves=lastDays(12,(a,b)=>cards.reduce((s,{c})=>s+c.history.filter(h=>{const d=new Date(h.enteredAt);return d>=a&&d<b}).length,0));
  let acc=0;const cum=created.map(v=>acc+=v);const today=created[created.length-1];
  const pipeCards=S.db.pipes.map(p=>`<div class="pipe-card" data-act="go" data-v="pipe" data-id="${p.id}"><span class="bar" style="background:${p.color}"></span>
    <h4>${esc(p.name)}</h4><div class="muted">${p.phases.length} fases · ${p.cards.length} cards</div>
    <div class="phase-strip">${p.phases.map(ph=>{const n=p.cards.filter(c=>c.phaseId===ph.id).length;return`<span title="${esc(ph.name)}: ${n}" style="background:${ph.color};opacity:${n?1:.3}"></span>`}).join('')}</div></div>`).join('');
  $('#content').innerHTML=`
  <div class="widgets">
    <div class="widget" style="background:#5856d6"><div class="w-top"><div><div class="w-val">${cards.length}<small>(+${today} hoje)</small></div><div class="w-lbl">Cards</div></div></div>${chartLine(created)}</div>
    <div class="widget" style="background:#3399ff"><div class="w-top"><div><div class="w-val">${S.db.pipes.length}<small>(${S.db.pipes.reduce((a,p)=>a+p.phases.length,0)} fases)</small></div><div class="w-lbl">Pipys</div></div></div>${chartLine(moves)}</div>
    <div class="widget" style="background:#f0ad1a"><div class="w-top"><div><div class="w-val">${files}</div><div class="w-lbl">Arquivos anexados</div></div></div>${chartLine(cum.length>1?cum:[0,0],true)}</div>
    <div class="widget" style="background:#e05555"><div class="w-top"><div><div class="w-val">${stale}<small>(+7 dias)</small></div><div class="w-lbl">Cards parados na fase</div></div></div>${chartBars(moves)}</div>
  </div>
  <div class="panel"><div class="panel-h"><div style="flex:1"><h3>Fluxos criados</h3><div class="muted" style="font-size:13px">Clique para abrir o quadro</div></div><button class="btn primary" data-act="newPipe">${ic('plus')} Novo pipy</button></div>
  <div class="panel-b">${S.db.pipes.length?`<div class="pipe-grid">${pipeCards}</div>`:`<div class="empty">${ic('board')}<div style="font-size:16px;color:var(--text);margin-bottom:6px">Nenhum pipy ainda</div><div style="margin-bottom:18px">Crie seu primeiro fluxo ou carregue um exemplo para explorar.</div><div class="row" style="justify-content:center"><button class="btn primary" data-act="newPipe">${ic('plus')} Criar pipy</button><button class="btn ghost" data-act="examplePipe">Carregar exemplo</button></div></div>`}</div></div>`;
}

</script>
<script>
/* pipyscox · views/board.js
   Quadro kanban e filtros */
'use strict';
/* ===================== Quadro (kanban) + filtros ===================== */
function timeBadge(since){const ms=Date.now()-new Date(since),d=ms/864e5;return`<span class="time-b ${d>7?'late':d>3?'warn':''}" data-since="${since}" title="Tempo na fase atual">${ic('clock')}<span class="tv">${fmtDur(ms)}</span></span>`}
function miniCard(pipe,c,preview){
  const ph=phaseOf(pipe,c.phaseId);let rows='';const passed=passedPhaseIds(c);let resp='';
  pipe.phases.filter(p=>passed.includes(p.id)).forEach(p=>p.fields.forEach(f=>{const v=c.values[f.id];
    if(f.type==='resp'&&v){resp=v}
    if(!f.showOnCard||f.type==='time')return;
    if(f.type==='phasetag'){const ch=phaseTagChips(pipe,c,f);if(ch)rows+=`<div class="mc-row">${ch}</div>`;return}
    if(isEmptyVal(f,v))return;
    const row=(icon,txt)=>rows+=`<div class="mc-row">${icon?ic(icon):''}<span class="k">${esc(f.label)}:</span> ${txt}</div>`;
    switch(f.type){
      case'text':row('',esc(String(v).slice(0,80))+(String(v).length>80?'…':''));break;
      case'date':row('cal',fmtDate(v));break;
      case'tag':rows+=`<div class="mc-row">${tagChips(f,v)}</div>`;break;
      case'file':rows+=`<div class="mc-row">${ic('clip')} ${v.length} arquivo${v.length>1?'s':''}</div>`;break;
      case'checkbox':rows+=`<div class="mc-row" style="color:var(--success)">${ic('chkb')} ${esc(f.label)}</div>`;break;
      case'select':rows+=`<div class="mc-row"><span class="k">${esc(f.label)}:</span> <span class="chip soft">${esc(optLabel(f,v))}</span></div>`;break;
      case'currency':row('',fmtMoney(v));break;
      case'cpf':{const d=digits(v);row('',`***.${d.slice(3,6)}.${d.slice(6,9)}-**`);break}
      case'resp':break;
      default:row('',esc(String(v)))}
  }));
  const nC=c.comments.length,nF=cardFiles(pipe,c);
  return`<div class="kcard" ${preview?'':`draggable="true" data-card="${c.id}" data-act="openCard" data-id="${c.id}"`} style="border-left-color:${ph?.color||'var(--border)'}">${preview?'':`<button class="icon-btn kdel" data-act="cardDel" data-p="${pipe.id}" data-id="${c.id}" title="Excluir card">${ic('trash')}</button>`}<div class="t">${esc(c.title)}</div>${rows}
  <div class="kfoot">${resp?`<span class="avatar xs" title="Responsável: ${esc(resp)}">${esc(initials(resp))}</span>`:''}<span>${fmtDate(c.createdAt)}</span>${nC?`<span class="ic2" title="${nC} comentário(s)">${ic('chat')}${nC}</span>`:''}${nF?`<span class="ic2" title="${nF} arquivo(s)">${ic('clip')}${nF}</span>`:''}${timeBadge(c.phaseEnteredAt)}</div></div>`;
}
const bf=()=>S.boardF[S.route.id]||(S.boardF[S.route.id]={q:'',tag:'',resp:'',stale:false});
function cardMatch(pipe,c,F){
  if(F.stale&&Date.now()-new Date(c.phaseEnteredAt)<=7*864e5)return false;
  if(F.resp){const rf=allFields(pipe).filter(({f})=>f.type==='resp');
    if(F.resp==='__none'){if(rf.some(({f})=>c.values[f.id]))return false}else if(!rf.some(({f})=>c.values[f.id]===F.resp))return false}
  if(F.tag){const[a,b]=F.tag.split(':');if(a==='ph'){if(!passedPhaseIds(c).includes(b))return false}else{const v=c.values[a];if(!Array.isArray(v)||!v.includes(b))return false}}
  if(F.q){const q=norm(F.q);const hay=norm([c.title,...allFields(pipe).map(({f})=>textVal(pipe,c,f)),...c.comments.map(x=>x.text)].join(' '));if(!hay.includes(q))return false}
  return true}
function viewPipe(){
  const p=pipeById(S.route.id);const F=bf();
  crumbs([{t:'Home',attrs:'data-v="home"'},{t:p.name}]);
  const tagOpts=allFields(p).filter(({f})=>f.type==='tag').flatMap(({f})=>f.options.map(o=>`<option value="${f.id}:${o.id}" ${F.tag===f.id+':'+o.id?'selected':''}>${esc(f.label)}: ${esc(o.label)}</option>`)).join('')+p.phases.map(ph=>`<option value="ph:${ph.id}" ${F.tag==='ph:'+ph.id?'selected':''}>Passou por: ${esc(ph.name)}</option>`).join('');
  const hasResp=allFields(p).some(({f})=>f.type==='resp');
  const respNames=[...new Set([...people(),...p.cards.flatMap(c=>allFields(p).filter(({f})=>f.type==='resp').map(({f})=>c.values[f.id]).filter(Boolean))])];
  $('#content').innerHTML=`<div class="page-head">
    <span style="width:14px;height:14px;border-radius:4px;background:${p.color}"></span>
    <input class="title-in" style="width:auto;max-width:100%;flex:0 1 auto" size="${Math.max(8,p.name.length+2)}" data-in="pipeName" value="${esc(p.name)}" title="Clique para renomear">
    <div class="sp"></div>
    <button class="btn ghost" data-act="pipeMenu">${ic('dots')} Opções</button>
    <button class="btn ghost" data-act="go" data-v="report" data-id="${p.id}">${ic('chart')} Relatórios</button>
    ${p.form.enabled?`<label class="btn ghost" style="cursor:pointer" title="Importar arquivos de resposta do formulário externo">${ic('form')} Importar respostas<input type="file" accept=".json" multiple hidden data-ch="formImport"></label>`:''}
    <button class="btn ghost" data-act="go" data-v="phase" data-id="${p.id}" data-ph="${p.phases[0]?.id||''}" ${p.phases.length?'':'disabled'}>${ic('layout')} Configurar cards</button>
    <button class="btn ghost" data-act="newPhase">${ic('plus')} Nova fase</button>
    <button class="btn primary" data-act="newCard" data-ph="${p.phases[0]?.id||''}" ${p.phases.length?'':'disabled'}>${ic('plus')} Novo card</button></div>
  <div class="filters">
    <label class="search">${ic('search')}<input data-in="bfQ" value="${esc(F.q)}" placeholder="Filtrar cards deste quadro..." id="bfQ"></label>
    <select class="input" data-ch="bfTag"><option value="">Todas as tags</option>${tagOpts}</select>
    ${hasResp?`<select class="input" data-ch="bfResp"><option value="">Todos os responsáveis</option><option value="__none" ${F.resp==='__none'?'selected':''}>Sem responsável</option>${respNames.map(n=>`<option ${F.resp===n?'selected':''}>${esc(n)}</option>`).join('')}</select>`:''}
    <label class="chk"><input type="checkbox" data-ch="bfStale" ${F.stale?'checked':''}> Parados há +7 dias</label>
    <button class="btn ghost sm" data-act="bfClear">${ic('x')} Limpar</button>
    <span class="muted" id="bfCount" style="font-size:13px"></span>
  </div>
  <div class="board" id="board"></div>`;
  renderBoard();
}
function renderBoard(){
  const p=pipeById(S.route.id);const F=bf();const el=$('#board');if(!el)return;
  const active=F.q||F.tag||F.resp||F.stale;let shown=0;
  const cols=p.phases.map(ph=>{const all=p.cards.filter(c=>c.phaseId===ph.id);const cs=all.filter(c=>cardMatch(p,c,F));shown+=cs.length;return`<div class="col" data-col="${ph.id}">
    <div class="col-head" draggable="true" data-phdrag="${ph.id}" style="border-top-color:${ph.color}"><span class="col-name" title="${esc(ph.name)}">${esc(ph.name)}</span>${ph.automations.length?`<span title="${ph.automations.length} automação(ões)" style="color:var(--warning);display:flex">${ic('zap')}</span>`:''}<span class="col-count">${active?cs.length+'/':''}${all.length}</span>
      <button class="icon-btn" data-act="phaseMenu" data-ph="${ph.id}" title="Opções da fase">${ic('dots')}</button></div>
    <div class="col-body">${cs.map(c=>miniCard(p,c)).join('')}</div>
    <div class="col-foot"><button class="add-card" data-act="newCard" data-ph="${ph.id}">${ic('plus')} Novo card</button></div></div>`}).join('');
  el.innerHTML=cols+`<div class="col ghost" data-act="newPhase">${ic('plus')}<div style="margin-top:6px">Nova fase</div></div>`;
  const cnt=$('#bfCount');if(cnt)cnt.textContent=active?`${shown} de ${p.cards.length} cards`:'';
}
function phaseMenuHtml(ph){return`<button class="it" data-act="phRename" data-ph="${ph.id}">${ic('edit')} Renomear fase</button>
  <div class="sec"><small>Cor da fase</small><div class="swatches">${COLORS.map(c=>`<button class="sw ${c===ph.color?'on':''}" style="background:${c}" data-act="phColor" data-ph="${ph.id}" data-c="${c}"></button>`).join('')}<input type="color" class="sw" value="${ph.color}" data-ch="phColorCustom" data-ph="${ph.id}" title="Cor personalizada"></div></div>
  <button class="it" data-act="go" data-v="phase" data-id="${S.route.id}" data-ph="${ph.id}">${ic('layout')} Configurar card e automações</button>
  <button class="it" data-act="phMove" data-ph="${ph.id}" data-d="-1">${ic('left')} Mover para a esquerda</button>
  <button class="it" data-act="phMove" data-ph="${ph.id}" data-d="1">${ic('right')} Mover para a direita</button>
  <button class="it danger" data-act="phDelete" data-ph="${ph.id}">${ic('trash')} Excluir fase</button>`}

</script>
<script>
/* pipyscox · views/card.js
   Modal do card: campos, comentários e atividades */
'use strict';
/* ===================== Card: campos, comentários, atividades ===================== */
function fieldInput(pipe,card,ph,f){
  const v=card.values[f.id];const d=`data-f="${f.id}"`;const req=f.required?' <b class="req">*</b>':'';
  const lab=`<span class="fl">${esc(f.label)}${req}</span>`;const err=validField(f,v);const bad=err?' bad':'';const errH=`<small class="ferr" data-err="${f.id}">${esc(err)}</small>`;
  const inp=(type,extra='')=>`<label class="f">${lab}<input type="${type}" class="input${bad}" data-in="fv" ${d} value="${esc(v??'')}" ${extra}>${errH}</label>`;
  switch(f.type){
    case'text':return`<label class="f">${lab}${f.multiline?`<textarea class="input" data-in="fv" ${d} placeholder="${esc(f.placeholder||'')}">${esc(v||'')}</textarea>`:`<input class="input" data-in="fv" ${d} value="${esc(v||'')}" placeholder="${esc(f.placeholder||'')}">`}</label>`;
    case'number':return inp('number','step="any"');
    case'currency':return`<label class="f">${lab}<div class="money"><span>R$</span><input type="number" step="0.01" min="0" class="input${bad}" data-in="fv" ${d} value="${esc(v??'')}" placeholder="0,00"></div>${errH}</label>`;
    case'email':return inp('email','placeholder="nome@empresa.com.br"');
    case'phone':return inp('tel','placeholder="(98) 99999-9999"');
    case'cpf':return inp('text','inputmode="numeric" placeholder="000.000.000-00"');
    case'date':return`<label class="f">${lab}<input type="date" class="input" data-in="fv" ${d} value="${esc(v||'')}"></label>`;
    case'select':return`<label class="f">${lab}<select class="input" data-ch="fsel" ${d}><option value="">Selecione...</option>${(f.options||[]).map(o=>`<option value="${o.id}" ${v===o.id?'selected':''}>${esc(o.label)}</option>`).join('')}</select></label>`;
    case'resp':{const list=people();if(v&&!list.includes(v))list.push(v);return`<label class="f">${lab}<select class="input" data-ch="fsel" ${d}><option value="">Sem responsável</option>${list.map(n=>`<option ${v===n?'selected':''}>${esc(n)}</option>`).join('')}</select></label>`}
    case'checkbox':return`<label class="chk" style="margin-bottom:16px"><input type="checkbox" data-ch="fchk" ${d} ${v?'checked':''}> ${esc(f.label)}${req}</label>`;
    case'tag':{const sel=Array.isArray(v)?v:[];return`<div style="margin-bottom:14px">${lab}<div class="tagsel">${(f.options||[]).map(o=>`<button class="${sel.includes(o.id)?'on':''}" style="${sel.includes(o.id)?'background:'+o.color:''}" data-act="tagToggle" ${d} data-o="${o.id}"><span class="dt" style="background:${o.color}"></span>${esc(o.label)}</button>`).join('')||'<span class="muted">Sem opções — configure na fase.</span>'}</div></div>`}
    case'file':{const list=Array.isArray(v)?v:[];return`<div style="margin-bottom:14px">${lab}
      <div class="files">${list.map((x,i)=>`<div class="file">${ic('clip')}<span class="nm" title="${esc(x.path)}">${esc(x.name)}</span><span class="muted">${fmtSize(x.size||0)}</span><button class="icon-btn" data-act="fileDl" ${d} data-i="${i}" title="Baixar">${ic('down')}</button><button class="icon-btn" data-act="fileRm" ${d} data-i="${i}" title="Remover">${ic('trash')}</button></div>`).join('')}</div>
      <label class="btn ghost sm" style="cursor:pointer">${ic('up')} Anexar arquivo<input type="file" multiple hidden data-ch="fileAdd" ${d} ${f.accept?`accept="${esc(f.accept)}"`:''}></label></div>`}
    case'time':{const ms=timeInPhase(card,ph.id);const prev=ms-(ph.id===card.phaseId?Date.now()-new Date(card.phaseEnteredAt):0);return`<div style="margin-bottom:14px"><span class="fl">${esc(f.label)}</span><div class="timebox">${ic('clock')} ${ph.id===card.phaseId?'Há <b>'+tick(card.phaseEnteredAt)+'</b> nesta fase'+(prev>1000?` <span class="muted">(+ ${fmtDur(prev)} em passagens anteriores)</span>`:''):ms?'Ficou <b>'+fmtDur(ms)+'</b> nesta fase':'Ainda não passou por esta fase'}</div></div>`}
    case'phasetag':return`<div style="margin-bottom:14px"><span class="fl">${esc(f.label)} <span class="muted" style="font-weight:400">· automático</span></span><div class="tagsel">${phaseTagChips(pipe,card,f)||'<span class="muted">Nenhuma fase ainda.</span>'}</div></div>`;
  }return'';
}
function renderCardModal(){

    <button class="btn ghost sm" style="margin-top:16px;color:var(--danger)" data-act="cardDelete">${ic('trash')} Excluir card</button></div></div>`;

<script>

function phaseCtx(){const p=pipeById(S.route.id);return{p,ph:phaseOf(p,S.route.ph)}}
function renderFbAll(){renderFbList();renderFbMini();renderFbProps();const{p,ph}=phaseCtx();const t=$('#phTabs');if(t)t.innerHTML=p.phases.map(x=>`<button class="tab ${x.id===ph.id?'on':''}" data-act="go" data-v="phase" data-id="${p.id}" data-ph="${x.id}"><span class="dot" style="background:${x.color}"></span><span class="tn">${esc(x.name)}</span> <span class="muted">${x.fields.length}</span>${x.automations.length?`<span style="color:var(--warning);display:flex">${ic('zap')}</span>`:''}</button>`).join('')}

  const sample={text:'Texto de exemplo',number:'42',currency:'2500',email:'nome@empresa.com.br',phone:'(98) 99999-0000',cpf:'529.982.247-25',date:todayLocal(),checkbox:true,resp:S.user||'Fulano'};
  ph.fields.forEach(f=>{fake.values[f.id]=f.type==='tag'?(f.options||[]).slice(0,1).map(o=>o.id):f.type==='select'?(f.options||[])[0]?.id:f.type==='file'?[{name:'documento.pdf'}]:sample[f.type]});

function optEditor(f,withColor){return`<div class="fl" style="margin:6px 0 8px">Opções</div>${(f.options||[]).map(o=>`<div class="opt-row">${withColor?`<input type="color" class="sw" value="${o.color}" data-ch="optColor" data-o="${o.id}">`:''}<input class="input" data-in="optName" data-o="${o.id}" value="${esc(o.label)}"><button class="icon-btn" data-act="optRm" data-o="${o.id}">${ic('trash')}</button></div>`).join('')}<button class="btn ghost sm" data-act="optAdd" style="margin-top:4px">${ic('plus')} Adicionar opção</button>`}

const selF=()=>{const{ph}=phaseCtx();return ph.fields.find(x=>x.id===S.selField)};

  else if(A0.action==='comment')params=`<label class="f" style="grid-column:span 2"><span>Texto do comentário</span><input class="input" data-in="adSet" data-k="text" value="${esc(A0.text)}" placeholder="Ex.: Lembrar de conferir os documentos"></label>`;

<script>
/* pipyscox · views/reports.js

'use strict';
/* ===================== Relatórios ===================== */
function weekStart(d){const x=new Date(d);x.setHours(0,0,0,0);const wd=(x.getDay()+6)%7;x.setDate(x.getDate()-wd);return x}
function viewReport(){
  const p=pipeById(S.route.id);const now=Date.now();
  crumbs([{t:'Home',attrs:'data-v="home"'},{t:p.name,attrs:`data-v="pipe" data-id="${p.id}"`},{t:'Relatórios'}]);
  const last=p.phases[p.phases.length-1];
  const enteredLast=c=>last&&c.history.find(h=>h.phaseId===last.id);
  const concluded=p.cards.filter(c=>last&&c.phaseId===last.id);
  const doneTimes=concluded.map(c=>new Date(enteredLast(c)?.enteredAt||c.phaseEnteredAt)-new Date(c.createdAt));
  const avgDone=doneTimes.length?doneTimes.reduce((a,b)=>a+b,0)/doneTimes.length:0;
  const open=p.cards.filter(c=>!last||c.phaseId!==last.id);
  const stale=open.filter(c=>now-new Date(c.phaseEnteredAt)>7*864e5).length;
  const per=p.phases.map(ph=>{const ds=[];p.cards.forEach(c=>c.history.forEach(h=>{if(h.phaseId===ph.id)ds.push((h.leftAt?new Date(h.leftAt):now)-new Date(h.enteredAt))}));return{ph,now:p.cards.filter(c=>c.phaseId===ph.id).length,avg:ds.length?ds.reduce((a,b)=>a+b,0)/ds.length:0,visits:ds.length}});
  const work=per.filter(x=>x.ph!==last);const bott=work.reduce((m,x)=>x.avg>(m?m.avg:0)?x:m,null);
  const maxAvg=Math.max(1,...per.map(x=>x.avg)),maxNow=Math.max(1,...per.map(x=>x.now));
  const W=8,w0=weekStart(new Date(now-7*(W-1)*864e5));const weeks=[...Array(W)].map((_,i)=>{const a=new Date(w0);a.setDate(a.getDate()+7*i);const b=new Date(a);b.setDate(b.getDate()+7);
    return{a,cr:p.cards.filter(c=>{const d=new Date(c.createdAt);return d>=a&&d<b}).length,dn:p.cards.filter(c=>{const h=enteredLast(c);if(!h)return false;const d=new Date(h.enteredAt);return d>=a&&d<b}).length}});
  const bar=(lb,color,val,max,txt,title)=>`<div class="rbar" title="${esc(title||'')}"><span class="lb"><span style="width:9px;height:9px;border-radius:3px;background:${color};flex:none"></span>${esc(lb)}</span><div class="tr"><div class="fi" style="width:${Math.max(.5,val/max*100)}%;background:${color}"></div></div><span class="vl">${txt}</span></div>`;
  const tagFields=allFields(p).filter(({f})=>f.type==='tag'||f.type==='select');

  $('#content').innerHTML=`<div class="page-head"><h1 class="page">Relatório · ${esc(p.name)}</h1><div class="sp"></div><button class="btn ghost no-print" data-act="go" data-v="pipe" data-id="${p.id}">${ic('board')} Voltar ao quadro</button><button class="btn primary no-print" data-act="printReport">${ic('print')} Exportar PDF</button></div>
  <p class="print-only muted">Gerado em ${fmtDateTime(nowISO())} por ${esc(S.user)} · pipyscox</p>

    <div class="panel"><div class="panel-h"><h3 style="font-size:15px">Cards em cada fase agora</h3></div><div class="panel-b">${per.map(x=>bar(x.ph.name,x.ph.color,x.now,maxNow,x.now)).join('')}</div></div>
  </div>
  <div class="panel" style="margin-bottom:20px"><div class="panel-h"><h3 style="font-size:15px">Criados × concluídos por semana</h3><span class="muted" style="font-size:13px">últimas ${W} semanas</span></div><div class="panel-b">
    <div class="legend"><span><i style="background:var(--s1)"></i>Criados</span><span><i style="background:var(--s2)"></i>Concluídos</span></div>${weekChart(weeks)}</div></div>
  ${tagBlocks?`<div class="rep-grid">${tagBlocks}</div>`:''}
  <div class="panel"><div class="panel-h"><h3 style="font-size:15px">Detalhe por fase</h3></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Fase</th><th class="num">Cards agora</th><th class="num">Passagens</th><th class="num">Tempo médio</th></tr></thead><tbody>
  ${per.map(x=>`<tr><td><span class="chip" style="background:${x.ph.color}">${esc(x.ph.name)}</span></td><td class="num">${x.now}</td><td class="num">${x.visits}</td><td class="num">${x.visits?fmtDurShort(x.avg):'—'}</td></tr>`).join('')}</tbody></table></div></div>`;
}
function weekChart(weeks){
  const w=720,h=220,pl=34,pr=8,pt=18,pb=28,iw=w-pl-pr,ih=h-pt-pb;const max=Math.max(1,...weeks.flatMap(x=>[x.cr,x.dn]));
  const step=Math.ceil(max/4)||1,top=step*4;const gw=iw/weeks.length,bw=Math.min(22,gw*.32);const y=v=>pt+ih-v/top*ih;
  const rb=(x,v,cls)=>{if(!v)return'';const yy=y(v),hh=pt+ih-yy,r=Math.min(4,hh);return`<path d="M${x},${pt+ih} V${yy+r} Q${x},${yy} ${x+r},${yy} H${x+bw-r} Q${x+bw},${yy} ${x+bw},${yy+r} V${pt+ih} Z" fill="var(${cls})"/>`};
  let g='';for(let i=0;i<=4;i++){const yy=y(step*i);g+=`<line class="${i?'grid':'base'}" x1="${pl}" x2="${w-pr}" y1="${yy}" y2="${yy}"/><text x="${pl-6}" y="${yy+4}" text-anchor="end">${step*i}</text>`}
  const bars=weeks.map((k,i)=>{const cx=pl+gw*i+gw/2,x1=cx-bw-1,x2=cx+1;const lbl=`${String(k.a.getDate()).padStart(2,'0')}/${String(k.a.getMonth()+1).padStart(2,'0')}`;
    return`<g class="wk"><title>Semana de ${lbl}: ${k.cr} criado(s), ${k.dn} concluído(s)</title><rect class="hit" x="${pl+gw*i}" y="${pt}" width="${gw}" height="${ih}"/>${rb(x1,k.cr,'--s1')}${rb(x2,k.dn,'--s2')}
    ${k.cr?`<text class="vt" x="${x1+bw/2}" y="${y(k.cr)-4}" text-anchor="middle">${k.cr}</text>`:''}${k.dn?`<text class="vt" x="${x2+bw/2}" y="${y(k.dn)-4}" text-anchor="middle">${k.dn}</text>`:''}<text x="${cx}" y="${h-8}" text-anchor="middle">${lbl}</text></g>`}).join('');
  return`<svg class="wchart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Cards criados e concluídos por semana">${g}${bars}</svg>`;
}

function cellVal(pipe,c,f){const v=c.values[f.id];if(isEmptyVal(f,v))return'';if(f.type==='tag')return tagChips(f,v);if(f.type==='file')return v.length+' arq.';if(f.type==='checkbox')return'✓';return esc(textVal(pipe,c,f).slice(0,60))}

function exportCsv(){const F=S.dataF;const rows=dataRows();const pipe=F.pipe?pipeById(F.pipe):null;const fields=dataFields(pipe);

  downloadBlob(new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}),`pipyscox-dados-${stamp()}.csv`)}

async function importFormResponses(fileList){
  const p=pipeById(S.route.id);let ok=0,skip=0,dup=0;
  for(const file of fileList){
    try{const o=JSON.parse(await file.text());
      if(o.pipyscoxForm!==1||o.pipeId!==p.id){skip++;continue}
      if(p.imported.includes(o.responseId)){dup++;continue}
      const phId=phaseOf(p,o.phaseId)?o.phaseId:(phaseOf(p,p.form.phaseId)?p.form.phaseId:p.phases[0].id);
      const at=nowISO();const c=normCard({id:uid(),title:String(o.title||'Resposta do formulário').slice(0,200),phaseId:phId,createdAt:at,phaseEnteredAt:at,history:[{phaseId:phId,enteredAt:at,leftAt:null}],values:{}});
      for(const[fid,v]of Object.entries(o.values||{})){const{f}=findField(p,fid);if(!f||f.type==='file')continue;
        if(f.type==='tag')c.values[fid]=(Array.isArray(v)?v:[]).filter(id=>f.options.some(x=>x.id===id));
        else if(f.type==='select')c.values[fid]=f.options.some(x=>x.id===v)?v:'';
        else if(f.type==='checkbox')c.values[fid]=!!v;else c.values[fid]=f.type==='cpf'?maskCPF(v):f.type==='phone'?maskPhone(v):String(v)}
      for(const[fid,list]of Object.entries(o.files||{})){const{f}=findField(p,fid);if(!f||f.type!=='file')continue;c.values[fid]=[];
        for(const x of list){const blob=await(await fetch(x.data)).blob();const safe=String(x.name).replace(/[\\/:*?"<>|]+/g,'_');const path=`arquivos/${p.id}/${c.id}/${Date.now()}-${safe}`;await writeFile(path,blob);c.values[fid].push({name:x.name,path,size:blob.size,type:x.type,addedAt:at})}}
      logCard(c,'Criado via formulário externo',`Enviado em ${fmtDateTime(o.submittedAt)} · arquivo ${file.name}`);
      if(o.consent)logCard(c,'Aceite LGPD registrado',`Aceito em ${fmtDateTime(o.consent.acceptedAt)}`);
      autoFill(p,c,phId);p.cards.push(c);p.imported.push(o.responseId);runAuto(p,c,phId,'enter');ok++;
    }catch(e){console.error(e);skip++}
  }
  save();renderMain();toast(`${ok} resposta(s) importada(s)${dup?`, ${dup} já importada(s) antes`:''}${skip?`, ${skip} arquivo(s) ignorado(s) (não pertencem a este pipy ou estão corrompidos)`:''}.`,ok?'ok':'warn',6000);
}

<script>
/* pipyscox · features/csv-import.js
   Importação de cards via CSV */
'use strict';
/* ===================== Importar CSV ===================== */
function parseCSV(txt){txt=txt.replace(/^﻿/,'');const first=txt.split(/\r?\n/)[0]||'';const del=first.split(';').length>first.split(',').length?';':(first.split('\t').length>first.split(',').length?'\t':',');
  const rows=[];let row=[],cur='',q=false;for(let i=0;i<txt.length;i++){const ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;else if(ch===del){row.push(cur);cur=''}else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur=''}else if(ch!=='\r')cur+=ch}
  if(cur||row.length){row.push(cur);rows.push(row)}return rows.filter(r=>r.some(c=>c.trim()))}
async function csvImportFlow(file){
  const p=pipeById(S.route.id);const buf=await file.arrayBuffer();let txt=new TextDecoder('utf-8').decode(buf);if(txt.includes('�'))txt=new TextDecoder('windows-1252').decode(buf);
  const rows=parseCSV(txt);if(rows.length<2){toast('O CSV precisa ter uma linha de cabeçalho e ao menos uma linha de dados.','warn');return}
  const head=rows[0].map(h=>h.trim());const fields=allFields(p).map(x=>x.f).filter(f=>!['file','time','phasetag'].includes(f.type));
  let tIdx=head.findIndex(h=>['titulo','title','nome','nome completo'].includes(norm(h)));if(tIdx<0)tIdx=0;
  const map=head.map((h,i)=>i===tIdx?{t:'title'}:{f:fields.find(f=>norm(f.label)===norm(h))});
  const data=rows.slice(1);
  if(!await confirmBox('Importar CSV',`<b>${data.length}</b> linha(s) serão criadas como cards na fase <b>${esc(p.phases[0].name)}</b>.<br><br><div class="fl">Mapeamento das colunas</div><div class="files">${head.map((h,i)=>`<div class="file"><span class="nm">${esc(h)}</span><span>${map[i].t?'<b>Título do card</b>':map[i].f?`→ ${esc(map[i].f.label)}`:'<span class="muted">ignorada</span>'}</span></div>`).join('')}</div><div class="muted" style="font-size:12px;margin-top:8px">As colunas são ligadas aos campos pelo nome (sem diferenciar maiúsculas e acentos). Datas em dd/mm/aaaa, tags separadas por vírgula, checkbox com "sim".</div>`,`Importar ${data.length} card(s)`)){renderMain();return}
  const ph=p.phases[0];let n=0;
  data.forEach(r=>{const at=nowISO();const c=normCard({id:uid(),title:(r[tIdx]||'').trim()||'Sem título',phaseId:ph.id,createdAt:at,phaseEnteredAt:at,history:[{phaseId:ph.id,enteredAt:at,leftAt:null}],values:{}});
    map.forEach((m,i)=>{if(m.f){const v=convertVal(m.f,r[i]);if(v!==undefined)c.values[m.f.id]=v}});
    logCard(c,'Importado de CSV',file.name);autoFill(p,c,ph.id);p.cards.push(c);runAuto(p,c,ph.id,'enter');n++});
  save();renderMain();toast(`${n} card(s) importado(s) do CSV.`);
}

  newCard(el){const p=pipeById(S.route.id);const phId=el.dataset.ph||p.phases[0]?.id;if(!phId)return;
    const now=nowISO();const c=normCard({id:uid(),title:'',phaseId:phId,createdAt:now,phaseEnteredAt:now,history:[{phaseId:phId,enteredAt:now,leftAt:null}],values:{}});autoFill(p,c,phId);
