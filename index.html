<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pipyscox</title>
<link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
<!-- Estilos (a ordem importa: base → telas → animações → responsivo → impressão) -->
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/dashboard.css">
<link rel="stylesheet" href="assets/css/board.css">
<link rel="stylesheet" href="assets/css/card.css">
<link rel="stylesheet" href="assets/css/builder.css">
<link rel="stylesheet" href="assets/css/reports.css">
<link rel="stylesheet" href="assets/css/animations.css">
<link rel="stylesheet" href="assets/css/responsive.css">
<link rel="stylesheet" href="assets/css/print.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="header">
      <button class="icon-btn" data-act="toggleSide" title="Menu"><svg class="i" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <label class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input id="gsearch" placeholder="Buscar cards em todos os pipys..." autocomplete="off"><span class="kbd">Ctrl /</span></label>
      <div class="sp"></div>
      <div class="save-st" id="saveSt"><span class="d"></span><span class="tx">Salvo</span></div>
      <div class="vsep"></div>
      <button class="icon-btn" data-act="toggleTheme" title="Alternar tema" id="themeBtn"></button>
      <div class="vsep"></div>
      <button class="avatar" id="avatar" data-act="changeUser" title="Trocar usuário">?</button>
    </header>
    <div class="crumbs" id="crumbs"></div>
    <main class="content" id="content"></main>
  </div>
</div>
<div id="gate" class="gate hidden"></div>
<div id="modalRoot"></div>
<div id="popRoot"></div>
<div class="toasts" id="toasts"></div>

<noscript><div style="padding:40px;text-align:center">O pipyscox precisa de JavaScript ativado.</div></noscript>

<!-- Scripts (ordem de carregamento: núcleo → interface → telas → recursos → app) -->

<script src="assets/js/ui/shell.js"></script>
<script src="assets/js/views/dashboard.js"></script>

<script src="assets/js/ui/animations.js"></script>
<script src="assets/js/app/timers.js"></script>
<script src="assets/js/app/boot.js"></script>

</html>
